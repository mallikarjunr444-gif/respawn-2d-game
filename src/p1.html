<title>Event Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Syncopate:wght@700&display=swap">
<style>
/* Layout: letterboxed 16:9 canvas stage, touch bar below on coarse pointers, one-line key legend on desktop */
:root{--void:#070a1a;--navy:#0d1433;--violet:#3b2a7a;--cyan:#3df0ff;--ember:#ff7a2e;--bone:#e9eefc;--dim:#8d97c4;
--display:'Syncopate','Arial Black',sans-serif;--ui:'Chakra Petch','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:8px;overflow:hidden}
#stage{width:min(100%,calc((100vh - 90px) * 1.7778));width:min(100%,calc((100dvh - 90px) * 1.7778));aspect-ratio:16/9;max-width:100%;border:1px solid #1d2754;box-shadow:0 0 70px rgba(61,240,255,.08)}
canvas{width:100%;height:100%;display:block;touch-action:none;background:#000;outline:none}
#keys{font-size:12px;letter-spacing:.08em;color:var(--dim);text-align:center;text-transform:uppercase}
#keys b{color:var(--cyan);font-weight:600}
#touch{display:none;width:100%;max-width:640px;justify-content:space-between;gap:8px;flex-wrap:wrap}
#touch .grp{display:flex;gap:8px}
.tb{min-width:56px;height:52px;padding:0 12px;border-radius:10px;border:1px solid #2a3770;background:#0d1433;color:var(--bone);font:700 13px var(--ui);letter-spacing:.08em;touch-action:none;user-select:none;-webkit-user-select:none}
.tb:active,.tb.on{background:#16306a;border-color:var(--cyan);color:var(--cyan)}
@media (pointer:coarse){#touch{display:flex}#keys{display:none}}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
<div id="stage"><canvas id="c" width="960" height="540" tabindex="0" aria-label="Event Horizon game"></canvas></div>
<div id="touch">
<div class="grp"><button class="tb" data-k="left" aria-label="Move left">◀</button><button class="tb" data-k="right" aria-label="Move right">▶</button></div>
<div class="grp"><button class="tb" data-k="use">USE</button><button class="tb" data-k="dash">DASH</button><button class="tb" data-k="atk">SLASH</button><button class="tb" data-k="jump">JUMP</button></div>
</div>
<div id="keys"><b>A D</b> move · <b>Space</b> jump · <b>Shift</b> dash · <b>J</b> slash · <b>E</b> use · <b>M</b> sound</div>
<script>
(()=>{
'use strict';
const W=960,H=540,GY=430;
const C={void:'#070a1a',navy:'#0d1433',violet:'#3b2a7a',cyan:'#3df0ff',ember:'#ff7a2e',bone:'#e9eefc',pink:'#ff5fa8',gold:'#ffd166',green:'#5dffb0',dim:'#8d97c4'};
const F_D="'Syncopate','Arial Black',Impact,sans-serif",F_U="'Chakra Petch','Segoe UI',system-ui,sans-serif";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const r=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth||W;cv.width=Math.round(w*r);cv.height=Math.round(w*r*H/W);}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,mod=(a,n)=>((a%n)+n)%n;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,col,align,font,weight,ls){ctx.font=(weight||600)+' '+size+'px '+(font||F_U);ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}ctx.fillText(s,x,y);try{ctx.letterSpacing='0px';}catch(e){}}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||'null');}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

/* ---------- input ---------- */
const MAP={arrowleft:['left'],a:['left'],arrowright:['right'],d:['right'],arrowup:['jump','up'],w:['jump','up'],' ':['jump','enter'],arrowdown:['down'],s:['down'],shift:['dash'],l:['dash'],j:['atk'],x:['atk'],e:['use'],f:['use'],enter:['enter'],escape:['esc'],m:['mute'],h:['hint'],r:['retry'],'1':['n1'],'2':['n2']};
let held={},pq={};
const pressed=a=>!!pq[a];
function press(a){if(!held[a])pq[a]=true;held[a]=true;}
function release(a){held[a]=false;}
addEventListener('keydown',e=>{const k=MAP[e.key.toLowerCase()];if(!k)return;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase()))e.preventDefault();audioInit();if(!e.repeat)k.forEach(press);});
addEventListener('keyup',e=>{const k=MAP[e.key.toLowerCase()];if(k)k.forEach(release);});
addEventListener('blur',()=>{held={};});
document.querySelectorAll('.tb').forEach(b=>{const a=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();press(a);if(a==='use'||a==='jump')press('enter');b.classList.add('on');});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{release(a);release('enter');b.classList.remove('on');}));});

/* ---------- audio (synthesized) ---------- */
let AC=null,master=null,droneG=null,muted=false;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
const o1=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter();o1.type=o2.type='sawtooth';o1.frequency.value=41;o2.frequency.value=41.8;lp.type='lowpass';lp.frequency.value=150;droneG=AC.createGain();droneG.gain.value=.03;o1.connect(lp);o2.connect(lp);lp.connect(droneG);droneG.connect(master);o1.start();o2.start();}catch(e){AC=null;}}
function tone(f,d,type,v,slide){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v,fc){if(!AC||muted)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||800;const g=AC.createGain();g.gain.value=v||.15;s.connect(f);f.connect(g);g.connect(master);s.start();}catch(e){}}
const SFX={jump(){tone(300,.16,'square',.05,2)},dash(){noise(.18,.12,1800)},swing(){tone(760,.16,'sawtooth',.06,.4)},hit(){tone(180,.14,'square',.1,.5);noise(.1,.1,600)},gem(){tone(880,.1,'sine',.09,1.6)},boom(){noise(.5,.25,260);tone(70,.4,'sine',.2,.4)},hurt(){tone(220,.25,'sawtooth',.12,.4)},click(){tone(520,.05,'square',.05)},ok(){tone(520,.12,'sine',.1,1.5);setTimeout(()=>tone(780,.2,'sine',.1,1.4),110)}};

/* ---------- particles ---------- */
const P=[];
function spawn(x,y,vx,vy,life,size,col,grav,add){if(P.length>600)P.shift();P.push({x,y,vx,vy,life,max:life,size,col,grav:grav||0,add:!!add});}
function burst(x,y,n,col,spd,life,add){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random()*.7);spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,life*(.5+Math.random()*.5),2+Math.random()*3,col,300,add);}}
function updFx(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawFx(cam){for(const p of P){ctx.globalAlpha=clamp(p.life/p.max,0,1)*(p.add?.8:1);ctx.globalCompositeOperation=p.add?'lighter':'source-over';ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-cam,p.y,p.size*(p.add?1:clamp(p.life/p.max,.3,1)),0,6.283);ctx.fill();}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
