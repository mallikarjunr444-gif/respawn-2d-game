<style>
:root{--void:#050716;--navy:#0d1433;--violet:#3b2a7a;--cyan:#3df0ff;--ember:#ff7a2e;--gold:#ffd166;--green:#3dff88;--bone:#e9eefc;--dim:#8d97c4;
--display:'Syncopate','Arial Black',sans-serif;--ui:'Chakra Petch','Segoe UI',system-ui,sans-serif;--orbit:'Orbitron',sans-serif;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}

body{background:var(--void);color:var(--bone);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 12px;
background-image:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(59,42,122,.2), transparent),
radial-gradient(ellipse 60% 40% at 80% 20%, rgba(61,240,255,.08), transparent),
radial-gradient(ellipse 50% 30% at 20% 30%, rgba(255,122,46,.06), transparent);
height:100%;height:100dvh;min-height:-webkit-fill-available;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}

@keyframes borderPulse{0%,100%{box-shadow:0 0 24px rgba(61,240,255,.08),inset 0 0 20px rgba(0,0,0,.4)}50%{box-shadow:0 0 36px rgba(61,240,255,.16),inset 0 0 20px rgba(0,0,0,.4)}}
@keyframes loadGlow{0%,100%{text-shadow:0 0 20px rgba(61,240,255,.8),0 0 60px rgba(61,240,255,.4)}50%{text-shadow:0 0 30px rgba(61,240,255,1),0 0 80px rgba(61,240,255,.6)}}

#stage{width:min(100%,calc((100vh - 124px) * 1.7778));width:min(100%,calc((100dvh - 124px) * 1.7778));aspect-ratio:16/9;max-width:100%;
border:1px solid rgba(61,240,255,.25);border-radius:6px;position:relative;
animation:borderPulse 4s ease-in-out infinite;background:#000;overflow:hidden}

canvas{width:100%;height:100%;display:block;touch-action:none;background:#000;outline:none;border-radius:5px}

#orvex-header{width:min(100%,calc((100vh - 124px) * 1.7778));width:min(100%,calc((100dvh - 124px) * 1.7778));display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:rgba(13,20,51,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(61,240,255,.15);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:10}
.brand{display:flex;align-items:center;gap:8px;font:700 13px var(--display);letter-spacing:2px;color:var(--bone);text-decoration:none}
.brand b{color:var(--cyan);font-weight:900}
.brand-glyph{filter:drop-shadow(0 0 6px rgba(61,240,255,.5))}
.title-pill{font:700 10px var(--ui);letter-spacing:3px;text-transform:uppercase;color:var(--cyan);background:rgba(59,42,122,.35);padding:3px 12px;border-radius:12px;border:1px solid rgba(61,240,255,.2)}
.actions{display:flex;align-items:center;gap:8px}
.godot-btn{display:flex;align-items:center;gap:6px;font:600 11px var(--ui);letter-spacing:1px;color:var(--cyan);background:rgba(61,240,255,.08);border:1px solid rgba(61,240,255,.2);padding:4px 10px;border-radius:6px;text-decoration:none;transition:all .15s ease}
.godot-btn:hover{background:rgba(61,240,255,.18);border-color:var(--cyan);transform:scale(1.03);color:#fff}
#fs-btn{background:rgba(255,255,255,.05);border:1px solid rgba(61,240,255,.15);color:var(--cyan);font-size:13px;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease}

#keys{font-size:11px;letter-spacing:.08em;color:var(--dim);text-align:center;text-transform:uppercase;padding:5px 14px;border-radius:8px;background:rgba(13,20,51,.5);backdrop-filter:blur(8px);border:1px solid rgba(61,240,255,.1)}
#keys b{color:var(--cyan);font-weight:700}

/* Mobile Touch Bar */
#touch{display:none;width:100%;max-width:720px;justify-content:space-between;align-items:center;gap:6px;padding:4px;touch-action:none}
.pad-left{display:flex;gap:4px}
.pad-center{display:flex;gap:6px;align-items:center}
.pad-right{display:flex;gap:4px}
.tb{min-width:48px;height:44px;padding:0 8px;border-radius:10px;border:1px solid rgba(61,240,255,.2);background:linear-gradient(180deg,rgba(13,20,51,.85),rgba(7,10,26,.95));backdrop-filter:blur(8px);color:var(--bone);font:700 11px var(--ui);letter-spacing:.05em;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s ease}
.tb:active,.tb.on{background:linear-gradient(180deg,rgba(22,48,106,.95),rgba(13,20,51,1));border-color:var(--cyan);color:var(--cyan);transform:scale(.94)}
.tb-dir{min-width:42px;height:42px;font-size:15px}
.tb-thrust{background:linear-gradient(180deg,rgba(255,122,46,.4),rgba(255,70,20,.6));border-color:var(--ember);color:#fff;min-width:68px}
.tb-boost{background:linear-gradient(180deg,rgba(61,240,255,.35),rgba(20,120,255,.6));border-color:var(--cyan);color:#fff;min-width:58px}
.tb-launch{background:linear-gradient(180deg,rgba(61,255,136,.3),rgba(20,180,90,.5));border-color:var(--green);color:#fff}

@media (pointer:coarse), (max-width: 900px){
  #touch{display:flex}
  #keys{display:none}
}
@media (max-width: 768px) and (orientation: portrait){
  #orvex-header{width:100%;padding:4px 8px}

#loader{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0d1433 0%,#070a1a 70%,#030510 100%);gap:18px;transition:opacity .6s ease}

.load-bar{width:220px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.load-bar span{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--ember));border-radius:4px;transition:width .2s ease}
</style>

<script>
(()=>{
'use strict';

const W = 960, H = 540;
const C = {
  void: '#040614', navy: '#0b1432', cyan: '#3df0ff', ember: '#ff7a2e',
  gold: '#ffd166', green: '#3dff88', bone: '#eaf0fc', dim: '#8e98c7',
  red: '#ff3d5a', purple: '#ba68f8'
};
const F_D = "'Syncopate','Arial Black',sans-serif", F_U = "'Chakra Petch','Segoe UI',sans-serif", F_O = "'Orbitron',sans-serif";

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit(){
  const r = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth || W;
  cv.width = Math.round(w * r);
  cv.height = Math.round(w * r * H / W);
}
addEventListener('resize', fit);
fit();

const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;
const mod = (a,n) => ((a%n)+n)%n;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,col,align,font,weight,ls){
  ctx.font = (weight||600)+' '+size+'px '+(font||F_U);
  ctx.fillStyle = col;
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'alphabetic';
  try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}
  ctx.fillText(s,x,y);
  try{ctx.letterSpacing='0px';}catch(e){}
}
function store(k,v){
  try{
    if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null');
    localStorage.setItem(k, JSON.stringify(v));
  }catch(e){return null;}
}

// Fullscreen
const fsBtn = document.getElementById("fs-btn");
if(fsBtn){
  fsBtn.addEventListener("click", () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
      fsBtn.textContent = "✕";
    } else {
      document.exitFullscreen().catch(()=>{});
      fsBtn.textContent = "⛶";
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if(fsBtn) fsBtn.textContent = document.fullscreenElement ? "✕" : "⛶";
  });
}

/* ──────── Audio Synthesizer ──────── */
let AC=null, master=null, thrusterGain=null, thrusterOsc=null, muted=false;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(AC.destination);

    // Continuous low engine rumble
    thrusterOsc = AC.createOscillator();
    const lp = AC.createBiquadFilter();
    thrusterGain = AC.createGain();
    thrusterOsc.type = 'triangle';
    thrusterOsc.frequency.value = 55;
    lp.type = 'lowpass';
    lp.frequency.value = 180;
    thrusterGain.gain.value = 0.0001;
    thrusterOsc.connect(lp);
    lp.connect(thrusterGain);
    thrusterGain.connect(master);
    thrusterOsc.start();
  }catch(e){AC=null;}
}
function setThrusterRumble(active){
  if(!AC||!thrusterGain) return;
  const target = active ? 0.08 : 0.0001;
  thrusterGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
}
function tone(f,d,type,v,slide){
  if(!AC||muted) return;
  try{
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f*slide), t+d);
    g.gain.setValueAtTime(v||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function noise(d,v,fc){
  if(!AC||muted) return;
  try{
    const n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
    for(let i=0;i<n;i++) a[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc||800;
    const g = AC.createGain(); g.gain.value = v||0.16;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  }catch(e){}
}
const SFX = {
  thrust(){ /* handled by rumble */ },
  boost(){ noise(0.28, 0.22, 1200); tone(140, 0.28, 'sawtooth', 0.15, 2.8); },
  fuel(){ tone(580, 0.12, 'sine', 0.14, 1.4); setTimeout(()=>tone(880, 0.18, 'sine', 0.14, 1.2), 70); },
  orb(){ tone(660, 0.14, 'triangle', 0.16, 1.3); setTimeout(()=>tone(990, 0.2, 'sine', 0.16, 1.5), 90); setTimeout(()=>tone(1320, 0.25, 'sine', 0.16), 180); },
  warn(){ tone(480, 0.08, 'square', 0.12); setTimeout(()=>tone(380, 0.12, 'square', 0.12), 90); },
  warp(){ noise(0.7, 0.3, 300); tone(90, 0.6, 'sine', 0.25, 6.0); },
  hit(){ tone(180, 0.15, 'sawtooth', 0.15, 0.5); noise(0.12, 0.15, 500); },
  boom(){ noise(0.6, 0.3, 240); tone(60, 0.5, 'sine', 0.25, 0.3); },
  click(){ tone(540, 0.04, 'square', 0.06); },
  upgrade(){ tone(520, 0.12, 'sine', 0.12, 1.5); setTimeout(()=>tone(780, 0.18, 'sine', 0.12, 1.3), 100); setTimeout(()=>tone(1040, 0.22, 'sine', 0.14), 200); }
};

/* ──────── Input Handling ──────── */
const MAP = {
  arrowleft: ['left'], a: ['left'],
  arrowright: ['right'], d: ['right'],
  arrowup: ['up'], w: ['up'],
  arrowdown: ['down'], s: ['down'],
  ' ': ['thrust'],
  shift: ['boost'],
  e: ['use'], enter: ['enter'],
  q: ['shield'],
  j: ['atk'], x: ['atk'],
  k: ['shoot'], z: ['shoot'],
  p: ['pause'], escape: ['pause', 'esc'],
  m: ['mute'], r: ['retry']
};
let held = {}, pq = {};
const pressed = a => !!pq[a];
function press(a){ if(!held[a]) pq[a]=true; held[a]=true; }
function release(a){ held[a]=false; }

addEventListener('keydown', e => {
  const k = MAP[e.key.toLowerCase()];
  if(!k) return;
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
  audioInit();
  if(!e.repeat) k.forEach(press);
});
addEventListener('keyup', e => {
  const k = MAP[e.key.toLowerCase()];
  if(k) k.forEach(release);
});
addEventListener('blur', () => { held={}; });

document.querySelectorAll('.tb').forEach(b => {
  const a = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ b.setPointerCapture(e.pointerId); }catch(err){}
    audioInit();
    press(a);
    b.classList.add('on');
  });
  const onUp = (e) => {
    try{ b.releasePointerCapture(e.pointerId); }catch(err){}
    release(a);
    b.classList.remove('on');
  };
  b.addEventListener('pointerup', onUp);
  b.addEventListener('pointercancel', onUp);
});

// Mobile Web Audio Unlock
['touchstart','touchend','pointerdown'].forEach(ev => {
  window.addEventListener(ev, () => {
    if(AC && AC.state==='suspended') AC.resume().catch(()=>{});
    else if(!AC) audioInit();
  }, {passive:true});
});

/* ──────── Particles & FX ──────── */
const P = [];
function spawn(x,y,vx,vy,life,size,col,grav,add){
  if(P.length > 900) P.shift();
  P.push({x,y,vx,vy,life,max:life,size,col,grav:grav||0,add:!!add,ox:x,oy:y});
}
function burst(x,y,n,col,spd,life,add){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = spd * (0.3 + Math.random()*0.7);
    spawn(x,y,Math.cos(a)*s, Math.sin(a)*s, life*(0.5+Math.random()*0.5), 2+Math.random()*3, col, 0, add);
  }
}
function updFx(dt){
  for(let i=P.length-1;i>=0;i--){
    const p = P[i];
    p.life -= dt;
    if(p.life <= 0){ P.splice(i,1); continue; }
    p.ox = p.x; p.oy = p.y;
    p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}
function drawFx(camX, camY){
  ctx.save();
  for(const p of P){
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a * (p.add ? 0.9 : 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    const sz = p.size;
    const px = p.x - camX, py = p.y - camY;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(px, py, sz, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ──────── 10 Planetary Worlds Data ──────── */
const PLANETS = [
  {
    id: 'black_space', name: 'LEVEL 1 — BLACK SPACE', sub: 'Escape the Singularity gravity pull. Learn to fly.',
    isSpace: true,
    width: 5800, height: 3200, sky: ['#02020a', '#080518'], accent: C.cyan, starCol: '#aaccff',
    hasHole: true, holePos: {x: 450, y: 1600}, holePullR: 2100, holeForce: 380, holeKillR: 150,
    gravity: 90, wind: {x: 0, y: 0}, drag: 0.015,
    minFuel: 15, cells: 32, orbs: 8, debris: 22,
    playerStart: {x: 1250, y: 1600}, gatePos: {x: 5200, y: 1600}
  },
  {
    id: 'neptune', name: 'LEVEL 2 — NEPTUNE', sub: 'Deep-blue azure atmosphere. Cross wind currents and icy debris.',
    isSpace: false,
    width: 6200, height: 3600, sky: ['#02081c', '#081e4a'], accent: '#4da6ff', starCol: '#66b3ff',
    hasHole: false, gravity: 160, wind: {x: -140, y: 25}, drag: 0.025,
    minFuel: 15, cells: 32, orbs: 8, debris: 24, windZones: 4,
    playerStart: {x: 550, y: 1800}, gatePos: {x: 5600, y: 1800}

// Load saved data
const saved = store('space_odyssey_save');
if(saved){
  if(saved.unlocked) G.unlockedWorlds = saved.unlocked;
  if(saved.credits) G.credits = saved.credits;
  if(saved.bestScores) G.bestScores = saved.bestScores;
  if(saved.tankLv) G.tankLv = saved.tankLv;
  if(saved.thrustLv) G.thrustLv = saved.thrustLv;
  if(saved.effLv) G.effLv = saved.effLv;
}
function saveData(){
  store('space_odyssey_save', {
    unlocked: G.unlockedWorlds,
    credits: G.credits,
    bestScores: G.bestScores,
    tankLv: G.tankLv,
    thrustLv: G.thrustLv,
    effLv: G.effLv
  });
}

function getMaxFuel(){ return 100 * (1 + G.tankLv * 0.25); }
function getFuelPct(){ return (G.fuel / getMaxFuel()) * 100; }
function getThrustMult(){ return 1 + G.thrustLv * 0.15; }
function getBurnMult(){ return Math.max(0.4, 1 - G.effLv * 0.15); }

/* ──────── Active Flight Level Entity Storage ──────── */
let PL = null;
let LVL = null;
let GATE = null;
let CELLS = [];
let ORBS = [];
let DEBRIS = [];
let HAZARDS = []; // Wind zones, heat zones, dust storms
let METEORS = [];
let UI_BUTTONS = [];

function initFlightLevel(worldIdx){
  G.worldIdx = worldIdx;
  const cfg = PLANETS[worldIdx];
  LVL = cfg;

  // Preserve collected fuel across levels (guarantee at least 55% for next sector)
  G.fuel = Math.max(G.fuel || 0, getMaxFuel() * 0.55);
  G.hp = 3;
  G.score = 0;
  G.cellsGot = 0;
  G.orbsGot = 0;
  G.shieldT = 0;
  G.shieldCd = 0;
  G.hasSword = worldIdx >= 2;
  G.hasBlaster = worldIdx >= 4;
  G.hasShield = worldIdx >= 6;

  P.length = 0;
  METEORS = [];

  PL = {
    x: cfg.playerStart.x,
    y: cfg.playerStart.y,
    vx: 80,
    vy: 0,
    angle: 0,
    face: 1,
    thrusting: false,
    boosting: false,
    boostCd: 0,
    boostT: 0,
    inv: 1.0,
    radius: 20
  };

  GATE = {
    x: cfg.gatePos.x,
    y: cfg.gatePos.y,
    radius: 65,
    rot: 0,
    launching: false,
    launchT: 0
  };

  // Generate Collectibles
  CELLS = [];
  ORBS = [];

  // Guaranteed safety fuel cells right ahead of the gate
  CELLS.push({ x: cfg.gatePos.x - 300, y: cfg.gatePos.y, got: false, rot: 0 });
  CELLS.push({ x: cfg.gatePos.x - 160, y: cfg.gatePos.y, got: false, rot: 0 });
  CELLS.push({ x: cfg.gatePos.x - 60, y: cfg.gatePos.y, got: false, rot: 0 });

  // Risky bonus fuel cells near the Singularity for daring pilots
  if(cfg.hasHole){
    CELLS.push({ x: 750, y: 1550, got: false, rot: 0 });
    CELLS.push({ x: 920, y: 1700, got: false, rot: 0 });
    CELLS.push({ x: 1080, y: 1500, got: false, rot: 0 });
  }

  const r = rng(200 + worldIdx * 37);
  const dirX = cfg.gatePos.x - cfg.playerStart.x;
  const dirY = cfg.gatePos.y - cfg.playerStart.y;

  for(let i=0; i<cfg.cells; i++){
    const t = (i + 1) / (cfg.cells + 1);
    const bx = cfg.playerStart.x + dirX * t;
    const by = cfg.playerStart.y + dirY * t;
    const ox = (r() - 0.5) * 600;
    const oy = (r() - 0.5) * 800;
    CELLS.push({
      x: clamp(bx + ox, 200, cfg.width - 200),
      y: clamp(by + oy, 200, cfg.height - 200),
      got: false,
      rot: r() * 6.28
    });
  }

  for(let j=0; j<cfg.orbs; j++){
    const t = (j + 1) / (cfg.orbs + 1);
    const bx = cfg.playerStart.x + dirX * t;
    const by = cfg.playerStart.y + dirY * t;
    const alt = (j % 2 === 0 ? 1 : -1) * (600 + r() * 400);
    ORBS.push({
      x: clamp(bx, 200, cfg.width - 200),
      y: clamp(by + alt, 200, cfg.height - 200),
      got: false,
      rot: 0
    });
  }

  // Hazards
  HAZARDS = [];
  if(cfg.windZones){
    for(let w=0; w<cfg.windZones; w++){
      HAZARDS.push({
        type: 'wind',
        x: lerp(cfg.playerStart.x + 800, cfg.gatePos.x - 600, w / cfg.windZones),
        y: 400 + r() * (cfg.height - 800),
        w: 600, h: 400,
        fx: cfg.wind.x * 1.5,
        fy: cfg.wind.y * 1.5
      });
    }
  }
  if(cfg.heatZones || cfg.acidZones){
    const hzCount = cfg.heatZones || cfg.acidZones;
    for(let h=0; h<hzCount; h++){
      HAZARDS.push({
        type: cfg.acidZones ? 'acid' : 'heat',
        x: lerp(cfg.playerStart.x + 700, cfg.gatePos.x - 500, h / hzCount),
        y: 500 + r() * (cfg.height - 1000),
        r: 220,
        drain: 3.5
      });
    }
  }
  if(cfg.dustStorms){
    for(let d=0; d<cfg.dustStorms; d++){
      HAZARDS.push({
        type: 'storm',
        x: lerp(cfg.playerStart.x + 700, cfg.gatePos.x - 600, d / cfg.dustStorms),
        y: 500 + r() * (cfg.height - 1000),
        r: 280
      });
    }
  }

  // Debris / Asteroids
  DEBRIS = [];
  for(let k=0; k<cfg.debris; k++){
    DEBRIS.push({
      x: clamp(cfg.playerStart.x + 400 + r() * (cfg.width - 800), 200, cfg.width - 200),
      y: clamp(300 + r() * (cfg.height - 600), 200, cfg.height - 200),
      vx: (r() - 0.5) * 40,
      vy: (r() - 0.5) * 40,
      radius: 20 + r() * 16,
      rot: r() * 6.28,
      rotSpd: (r() - 0.5) * 1.5,
      hp: 2
    });
  }

  G.camX = PL.x - W/2;
  G.camY = PL.y - H/2;
  G.scene = 'play';
  G.toast = { a: cfg.name, b: cfg.sub, t: 4.5 };
}

/* ──────── Draw Background & Starfields ──────── */
const BG_STARS = Array.from({length: 120}, () => ({
  x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random()*1.8, sp: 0.5 + Math.random()*2, ph: Math.random()*6.28
}));

function drawBackground(cfg, camX, camY, t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, cfg.sky[0]);
  g.addColorStop(1, cfg.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Parallax stars
  for(let i=0; i<BG_STARS.length; i++){
    const s = BG_STARS[i];
    const sx = mod(s.x - camX * 0.05, W);
    const sy = mod(s.y - camY * 0.05, H);
    const alpha = 0.4 + 0.6 * (0.5 + 0.5*Math.sin(t*s.sp + s.ph));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = cfg.starCol || '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Distant planetary glow
  const px = W * 0.7 - camX * 0.02, py = H * 0.3 - camY * 0.02;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(px, py, 40, px, py, 260);
  glow.addColorStop(0, cfg.accent + '22');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(px, py, 260, 0, 6.283);
  ctx.fill();
  ctx.restore();

  // For Neptune (Level 2), render prominent azure ice giant planet with glowing atmosphere and icy rings
  if(cfg.id === 'neptune'){
    const nx = W * 0.76 - camX * 0.03, ny = H * 0.32 - camY * 0.03;
    ctx.save();
    // Ambient azure nebula cloud
    const neb = ctx.createRadialGradient(nx, ny, 30, nx, ny, 300);
    neb.addColorStop(0, 'rgba(40,130,255,0.28)');
    neb.addColorStop(0.5, 'rgba(20,80,200,0.14)');
    neb.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = neb;
    ctx.beginPath();
    ctx.arc(nx, ny, 300, 0, 6.283);
    ctx.fill();

    // Neptune Gas Giant Body
    const plGrad = ctx.createRadialGradient(nx - 28, ny - 28, 12, nx, ny, 90);
    plGrad.addColorStop(0, '#7ce8ff');
    plGrad.addColorStop(0.35, '#2680eb');
    plGrad.addColorStop(0.8, '#0a2e7a');
    plGrad.addColorStop(1, '#041133');
    ctx.fillStyle = plGrad;
    ctx.beginPath();
    ctx.arc(nx, ny, 90, 0, 6.283);
    ctx.fill();

    // Atmospheric rim glow
    ctx.strokeStyle = 'rgba(140,225,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Tilted thin faint icy ring
    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(-0.35);
    ctx.strokeStyle = 'rgba(160,230,255,0.4)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 0, 150, 24, 0, 0, 6.283);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
}

/* ──────── Draw Space Rocket Ship (Space Mode: ONLY ROCKET) ──────── */
function drawRocketShip(p, camX, camY, t){
  const sx = p.x - camX, sy = p.y - camY;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(p.angle);

  // Left Delta Wing (bottom fin in +Y)
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.moveTo(-8, 8);
  ctx.lineTo(-24, 25);
  ctx.lineTo(-8, 25);
  ctx.lineTo(6, 10);
  ctx.closePath();
  ctx.fill();

  // Right Delta Wing (top fin in -Y)
  ctx.beginPath();
  ctx.moveTo(-8, -8);
  ctx.lineTo(-24, -25);
  ctx.lineTo(-8, -25);
  ctx.lineTo(6, -10);
  ctx.closePath();
  ctx.fill();

  // Winglet accents
  ctx.fillStyle = '#ff7a2e';
  ctx.fillRect(-26, 21, 5, 5);
  ctx.fillRect(-26, -26, 5, 5);

  // Main Engine Nozzles at the back (rear is -X)
  ctx.fillStyle = '#2f3542';
  rr(-24, -7, 6, 14, 2);
  ctx.fill();
  ctx.fillStyle = p.thrusting ? '#ff7a2e' : '#ff4757';
  rr(-27, -5, 4, 10, 1);
  ctx.fill();

  // Sleek Aerodynamic Rocket Fuselage (Hull)
  const hg = ctx.createLinearGradient(-20, -12, -20, 12);
  hg.addColorStop(0, '#8a99b8');
  hg.addColorStop(0.3, '#ffffff');
  hg.addColorStop(0.7, '#e8f0fe');
  hg.addColorStop(1, '#65738e');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(30, 0);
  ctx.quadraticCurveTo(8, -13, -20, -10);
  ctx.lineTo(-20, 10);
  ctx.quadraticCurveTo(8, 13, 30, 0);
  ctx.closePath();
  ctx.fill();

  // Fleet Red Racing Stripe
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.moveTo(4, -9);
  ctx.lineTo(10, -8);
  ctx.lineTo(8, 8);
  ctx.lineTo(2, 9);
  ctx.closePath();
  ctx.fill();

  // Center Dorsal Fin / Panel line
  ctx.strokeStyle = '#475267';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.lineTo(16, 0);
  ctx.stroke();

  // Pressurized Cockpit Canopy Glass (Glowing Cyan)
  const cg = ctx.createLinearGradient(6, -4, 20, 4);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.35, C.cyan);
  cg.addColorStop(1, '#0b2447');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(10, 0, 9, 4.5, 0, 0, 6.283);
  ctx.fill();

  // Specular Cockpit Glint
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(13, -1.5, 3.5, 1.2, -0.2, 0, 6.283);
  ctx.fill();

  // Shield Bubble if active
  if(G.shieldT > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(61,240,255,0.18)';
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, 6.283);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

/* ──────── Draw Astronaut Hero (Planet Mode: CHARACTER ON PLANET) ──────── */
function drawAstronautCharacter(p, camX, camY, t){
  const sx = p.x - camX, sy = p.y - camY;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(p.angle);

  const fem = G.char === 'mira';
  const suit = fem ? '#f0e6ff' : '#d8edff';
  const dark = fem ? '#281a44' : '#14244c';
  const acc = fem ? '#ff66cc' : C.cyan;

  // Maneuvering Booster Pack on Astronaut
  ctx.fillStyle = '#44506c';
  rr(-16, -10, 10, 20, 3);
  ctx.fill();
  ctx.fillStyle = '#ff7a2e';
  rr(-18, -6, 4, 12, 2);
  ctx.fill();

  // Planetary Suit Body
  ctx.fillStyle = suit;
  rr(-10, -12, 22, 24, 6);
  ctx.fill();

  // Accent band
  ctx.fillStyle = acc;
  rr(-6, -12, 6, 24, 2);
  ctx.fill();

  // Exploration Helmet
  ctx.fillStyle = suit;
  ctx.beginPath();
  ctx.arc(10, 0, 10, 0, 6.283);
  ctx.fill();

  // Visor (glowing)
  const vg = ctx.createLinearGradient(10, -6, 18, 6);
  vg.addColorStop(0, C.cyan);
  vg.addColorStop(1, '#0b1e4a');
  ctx.fillStyle = vg;
  ctx.beginPath();
  ctx.ellipse(13, 0, 6, 7, 0, 0, 6.283);
  ctx.fill();

  // Shield Bubble if active
  if(G.shieldT > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(61,240,255,0.18)';
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, 6.283);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawPlayer(p, camX, camY, t){
  const inSpace = LVL && (LVL.id === 'black_space' || LVL.isSpace);
  if(inSpace){
    drawRocketShip(p, camX, camY, t);
  } else {
    drawAstronautCharacter(p, camX, camY, t);
  }
}

/* ──────── Draw Launch Gate ──────── */
function drawGate(gate, camX, camY, t){
  const gx = gate.x - camX, gy = gate.y - camY;
  if(gx < -150 || gx > W+150 || gy < -150 || gy > H+150) return;

  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(gate.rot);

  // Outer portal glow
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 30, 0, 0, 130);
  gl.addColorStop(0, 'rgba(61,240,255,0.45)');
  gl.addColorStop(0.7, 'rgba(61,255,136,0.15)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.arc(0, 0, 130, 0, 6.283);
  ctx.fill();

  // Outer rotating ring
  ctx.strokeStyle = C.cyan;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 65, 0, 6.283);
  ctx.stroke();

  // Ring markers
  for(let i=0; i<8; i++){
    const a = i * (Math.PI / 4);
    ctx.fillStyle = C.green;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*65, Math.sin(a)*65, 5, 0, 6.283);
    ctx.fill();
  }

  // Inner counter-rotating ring
  ctx.rotate(-gate.rot * 2.2);
  ctx.strokeStyle = C.green;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 44, 0, 6.283);
  ctx.stroke();

  // Center diamond warp portal
  ctx.fillStyle = 'rgba(61,240,255,0.7)';
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.lineTo(26, 0);
  ctx.lineTo(0, 26);
  ctx.lineTo(-26, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/* ──────── Draw Black Hole (Level 1 ONLY) ──────── */
function drawBlackHole(hole, camX, camY, t){
  const hx = hole.pos.x - camX, hy = hole.pos.y - camY;
  ctx.save();
  ctx.translate(hx, hy);

  // Outer gravitational lensing glow & distortion halo
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, hole.killR * 0.8, 0, 0, 560);
  gl.addColorStop(0, 'rgba(255,140,40,0.85)');
  gl.addColorStop(0.2, 'rgba(255,70,160,0.5)');
  gl.addColorStop(0.5, 'rgba(130,40,255,0.22)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.arc(0, 0, 560, 0, 6.283);
  ctx.fill();

  // Swirling accretion disk rings
  ctx.save();
  ctx.rotate(-t * 0.65);
  const ringColors = ['#ff8833','#ff3388','#b044ff','#ffd700','#3df0ff'];
  for(let i=0; i<5; i++){
    ctx.strokeStyle = ringColors[i];
    ctx.lineWidth = 16 - i * 2.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 160 + i*42, 50 + i*14, 0, 0, 6.283);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,235,190,0.75)';

  ctx.fillStyle = '#010105';
  ctx.beginPath();
  ctx.arc(0, 0, hole.killR, 0, 6.283);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(0, 0, hole.killR, 0, 6.283);

/* ──────── Draw Collectibles ──────── */
function drawFuelCell(c, camX, camY, t){
  const cx = c.x - camX, cy = c.y - camY + Math.sin(t*3 + c.x)*5;
  if(cx < -40 || cx > W+40 || cy < -40 || cy > H+40) return;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 1.5);

  // Glow
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
  gl.addColorStop(0, 'rgba(61,255,136,0.6)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.fillRect(-24, -24, 48, 48);

  // Emerald diamond
  ctx.fillStyle = C.green;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(12, 0);
  ctx.lineTo(0, 14);
  ctx.lineTo(-12, 0);
  ctx.closePath();
  ctx.fill();

  ctx.lineWidth = 2;

function drawEnergyOrb(o, camX, camY, t){
  const ox = o.x - camX, oy = o.y - camY + Math.sin(t*2.5 + o.x)*6;
  if(ox < -50 || ox > W+50 || oy < -50 || oy > H+50) return;

  ctx.save();
  ctx.translate(ox, oy);

  // Golden halo
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 6, 0, 0, 32);
  gl.addColorStop(0, 'rgba(255,209,102,0.7)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');

  // Core
  ctx.fillStyle = C.gold;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, 6.283);

  ctx.lineWidth = 2;

function drawDebris(d, camX, camY){
  const dx = d.x - camX, dy = d.y - camY;
  if(dx < -60 || dx > W+60 || dy < -60 || dy > H+60) return;

  ctx.save();
  ctx.translate(dx, dy);
  ctx.rotate(d.rot);

  ctx.fillStyle = '#655e52';
  ctx.strokeStyle = '#9c9282';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -d.radius);
  ctx.lineTo(d.radius*0.8, -d.radius*0.6);
  ctx.lineTo(d.radius, d.radius*0.3);
  ctx.lineTo(d.radius*0.4, d.radius*0.9);
  ctx.lineTo(-d.radius*0.5, d.radius*0.8);
  ctx.lineTo(-d.radius*0.9, -d.radius*0.2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawHazards(haz, camX, camY, t){
  for(const h of haz){
    const hx = h.x - camX, hy = h.y - camY;
    if(h.type === 'wind'){
      if(hx < -h.w || hx > W+h.w || hy < -h.h || hy > H+h.h) continue;
      ctx.save();
      ctx.fillStyle = 'rgba(61,240,255,0.06)';
      rr(hx - h.w/2, hy - h.h/2, h.w, h.h, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(61,240,255,0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      txt('WIND CURRENT ➔', hx, hy - h.h/2 + 24, 12, C.cyan, 'center', F_U, 700);
      ctx.restore();
    } else if(h.type === 'heat' || h.type === 'acid'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const col = h.type === 'heat' ? 'rgba(255,100,30,' : 'rgba(180,240,40,';
      const gl = ctx.createRadialGradient(hx, hy, 10, hx, hy, h.r);
      gl.addColorStop(0, col + '0.4)');
      gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(hx, hy, h.r, 0, 6.283);
      ctx.fill();
      txt(h.type === 'heat' ? '⚠️ SOLAR RADIATION' : '⚠️ ACID CLOUD', hx, hy - h.r + 20, 12, col + '0.9)', 'center', F_U, 700);
      ctx.restore();
    } else if(h.type === 'storm'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gl = ctx.createRadialGradient(hx, hy, 10, hx, hy, h.r);
      gl.addColorStop(0, 'rgba(255,100,50,0.3)');
      gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(hx, hy, h.r, 0, 6.283);

      txt('🌪️ DUST STORM', hx, hy - h.r + 20, 12, '#ffaa66', 'center', F_U, 700);
      ctx.restore();
    }
  }
}

/* ──────── HUD Drawing ──────── */
function drawHUD(){
  const pct = getFuelPct();
  const maxF = getMaxFuel();

  // Fuel Gauge Top Left
  const fx = 24, fy = 20, fw = 220, fh = 16;
  ctx.fillStyle = 'rgba(7,10,26,0.85)';
  rr(fx-4, fy-4, fw+8, fh+26, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(61,240,255,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Fuel bar fill
  rr(fx, fy+14, fw, fh, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fill();

  const fuelColor = pct > 50 ? C.green : pct > 25 ? C.gold : C.red;
  if(pct <= 25 && Math.sin(G.t * 12) > 0){
    ctx.fillStyle = '#ff8888';
  } else {
    ctx.fillStyle = fuelColor;
  }
  rr(fx, fy+14, fw * clamp(pct/100, 0, 1), fh, 4);
  ctx.fill();

  txt('FUEL: ' + Math.floor(pct) + '%', fx, fy+9, 13, fuelColor, 'left', F_U, 700);

  // Hull / Shield Integrity Pips
  const px = 280, py = 28;
  for(let i=0; i<3; i++){
    ctx.fillStyle = i < G.hp ? C.cyan : 'rgba(255,255,255,0.15)';
    rr(px + i*26, py, 20, 14, 3);
    ctx.fill();
  }
  txt('HULL', px, py - 6, 11, C.dim, 'left', F_U, 600);

  // Center Sector Title & Radar to Gate
  txt(LVL.name, W/2, 24, 15, C.bone, 'center', F_U, 700, 2);

  const dx = GATE.x - PL.x, dy = GATE.y - PL.y;
  const distGate = Math.hypot(dx, dy);
  const angleGate = Math.atan2(dy, dx);
  const arrow = getArrow(angleGate);
  const ready = pct >= LVL.minFuel;
  const reached = distGate < GATE.radius + 30;
  let statusCol, statusText;
  if(GATE.launching){
    statusCol = C.cyan;
    statusText = '★ GATE ENGAGED! WARPING TO NEXT PLANET...';
  } else if(reached){
    statusCol = ready ? C.green : C.ember;
    statusText = ready ? '✔ LAUNCH GATE REACHED — PRESS [E] OR CLICK WARP' : '[NEED ' + LVL.minFuel + '% FUEL TO WARP]';
  } else {
    statusCol = ready ? C.green : C.ember;
    statusText = ready ? '[READY TO WARP]' : '[NEED ' + LVL.minFuel + '% FUEL]';
  }

  txt('LAUNCH GATE: ' + Math.floor(distGate) + 'm ' + arrow + ' ' + statusText, W/2, 42, 13, statusCol, 'center', F_U, 700, 1);

  // Level 1 Black Hole Distance Warning & Escape indicator
  if(LVL.hasHole){
    const holeD = Math.hypot(LVL.holePos.x - PL.x, LVL.holePos.y - PL.y);
    if(holeD < 2000){
      const warnColor = holeD < 500 ? (Math.sin(G.t*12)>0 ? C.red : '#fff') : (holeD < 1000 ? C.ember : C.purple);
      const escapeHint = PL.x >= LVL.holePos.x ? '➔ ESCAPE DIRECTION: EAST (FLY RIGHT)' : '➔ ESCAPE: FLY EAST AWAY FROM HOLE';
      txt('⚠️ SINGULARITY BEHIND: ' + Math.floor(holeD) + 'm | ' + escapeHint, W/2, 60, 12, warnColor, 'center', F_U, 700);
    }
  }

  // Top Right: Credits & Score
  txt('CREDITS: ' + G.credits, W - 24, 24, 15, C.gold, 'right', F_U, 700);
  txt('CELLS: ' + G.cellsGot + ' | ORBS: ' + G.orbsGot, W - 24, 42, 12, C.cyan, 'right', F_U, 600);

  // Bottom Toast
  if(G.toast && G.toast.t > 0){
    const a = clamp(Math.min(G.toast.t, 1), 0, 1);
    ctx.globalAlpha = a;
    rr(W/2 - 240, 100, 480, 56, 8);
    ctx.fillStyle = 'rgba(7,10,26,0.92)';
    ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    txt(G.toast.a, W/2, 124, 17, C.gold, 'center', F_D, 700, 2);
    txt(G.toast.b, W/2, 144, 13, C.bone, 'center', F_U, 600, 1);
    ctx.globalAlpha = 1;
  }
}

function getArrow(angle){
  let deg = angle * 180 / Math.PI;
  if(deg < 0) deg += 360;
  if(deg >= 337.5 || deg < 22.5) return '➔';
  if(deg >= 22.5 && deg < 67.5) return '➘';
  if(deg >= 67.5 && deg < 112.5) return '⬇';
  if(deg >= 112.5 && deg < 157.5) return '↙';
  if(deg >= 157.5 && deg < 202.5) return '⬅';
  if(deg >= 202.5 && deg < 247.5) return '↖';
  if(deg >= 247.5 && deg < 292.5) return '⬆';
  return '➚';
}

function uiButton(label, x, y, w, h, fn, opts){
  opts = opts || {};
  const hov = G.mx >= x && G.mx <= x + w && G.my >= y && G.my <= y + h;
  UI_BUTTONS.push({x, y, w, h, fn});

  ctx.save();
  rr(x, y, w, h, opts.r || 8);
  if(opts.disabled){
    ctx.fillStyle = 'rgba(20,24,40,0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,110,140,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    txt(label, x + w/2, y + h/2 + 5, opts.sz || 14, '#556080', 'center', F_U, 700);
  } else {
    const bg = ctx.createLinearGradient(x, y, x, y+h);
    if(hov || opts.sel){
      bg.addColorStop(0, 'rgba(61,240,255,0.25)');
      bg.addColorStop(1, 'rgba(13,20,51,0.95)');
    } else {
      bg.addColorStop(0, 'rgba(16,24,60,0.85)');
      bg.addColorStop(1, 'rgba(7,10,26,0.95)');
    }
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = (hov || opts.sel) ? (opts.col || C.cyan) : 'rgba(141,151,196,0.35)';
    ctx.lineWidth = (hov || opts.sel) ? 2 : 1;
    ctx.stroke();
    txt(label, x + w/2, y + h/2 + 5, opts.sz || 14, (hov || opts.sel) ? (opts.col || C.cyan) : C.bone, 'center', F_U, 700);
  }
  ctx.restore();
}

/* ──────── Main Simulation Step (PLAY) ──────── */
function updatePlay(dt){
  const p = PL, cfg = LVL;
  G.shake = Math.max(0, G.shake - dt * 25);
  if(G.toast && G.toast.t > 0) G.toast.t -= dt;
  p.boostCd -= dt;
  p.inv -= dt;
  G.shieldCd -= dt;
  if(G.shieldT > 0) G.shieldT -= dt;

  // Directional Steering & Thrust Controls
  // Up / W: Accelerate forward in facing direction
  // Left / A: Steer rocket angle counter-clockwise
  // Right / D: Steer rocket angle clockwise
  // Down / S: Airbrake / Reverse
  // Space: Main thruster
  // Shift: Rocket boost

  let steerDir = 0;
  if(held.left) steerDir -= 1;
  if(held.right) steerDir += 1;

  if(steerDir !== 0){
    p.angle += steerDir * 3.8 * dt;
    p.face = Math.cos(p.angle) >= 0 ? 1 : -1;
  }

  // Forward thrust with Up / W or Space
  const wantThrust = held.up || held.thrust || pressed('thrust');
  const isBraking = held.down;
  const hasFuel = G.fuel > 0;

  p.thrusting = wantThrust;
  setThrusterRumble(wantThrust && hasFuel);

  if(wantThrust){
    const thrustPower = 760 * getThrustMult();
    const cosA = Math.cos(p.angle), sinA = Math.sin(p.angle);

    if(hasFuel){
      p.vx += cosA * thrustPower * dt;
      p.vy += sinA * thrustPower * dt;
      // Rebalanced burn rate (3.2/s instead of 8.0/s)
      const burn = 3.2 * getBurnMult() * dt;
      G.fuel = Math.max(0, G.fuel - burn);
    } else {
      // Emergency solar glide: low-power reserve thrust so astronaut is NEVER permanently stranded
      p.vx += cosA * (thrustPower * 0.45) * dt;
      p.vy += sinA * (thrustPower * 0.45) * dt;
    }

    // Rocket exhaust flame particles pointing backward
    for(let i=0; i<3; i++){
      const ex = p.x - cosA * 20 + (Math.random()-0.5)*5;
      const ey = p.y - sinA * 20 + (Math.random()-0.5)*5;
      const col = hasFuel ? (Math.random()<0.4 ? '#ffea00' : (Math.random()<0.7 ? '#ff6600' : '#ff1144')) : '#5ce6ff';
      spawn(ex, ey, -cosA * 260 + (Math.random()-0.5)*50, -sinA * 260 + (Math.random()-0.5)*50, 0.3, 4.5, col, 0, true);
    }
    // Extra ion wake when escaping black hole
    if(cfg.hasHole && p.vx > 0){
      spawn(p.x - cosA * 24, p.y - sinA * 24, -cosA * 320, -sinA * 320, 0.25, 3.5, C.cyan, 0, true);
    }
  }

  // Airbrake / Reverse (Down / S)
  if(isBraking){
    p.vx *= (1.0 - 2.8 * dt);
    p.vy *= (1.0 - 2.8 * dt);
    const cosA = Math.cos(p.angle), sinA = Math.sin(p.angle);
    p.vx -= cosA * 240 * dt;
    p.vy -= sinA * 240 * dt;
  }

  // Rocket Boost
  if(pressed('boost') && p.boostCd <= 0 && G.fuel >= 8){
    p.boostCd = 1.4;
    p.boostT = 0.35;
    G.fuel -= 8;
    p.inv = Math.max(p.inv, 0.45);
    SFX.boost();
    G.shake = 7;
  }
  if(p.boostT > 0){
    p.boostT -= dt;
    const cosA = Math.cos(p.angle), sinA = Math.sin(p.angle);
    p.vx += cosA * 1350 * dt;
    p.vy += sinA * 1350 * dt;
    // Strong rocket exhaust burst when boosting away
    for(let i=0; i<4; i++){
      const ex = p.x - cosA*22 + (Math.random()-0.5)*6;
      const ey = p.y - sinA*22 + (Math.random()-0.5)*6;
      spawn(ex, ey, -cosA * 420 + (Math.random()-0.5)*70, -sinA * 420 + (Math.random()-0.5)*70, 0.4, 5.5, Math.random()<0.5?C.cyan:'#ffffff', 0, true);
      spawn(ex, ey, -cosA * 300, -sinA * 300, 0.28, 3.5, '#7b2cbf', 0, true);
    }
  }

  // Shield
  if(pressed('shield') && G.hasShield && G.shieldCd <= 0){
    G.shieldT = 1.8;
    G.shieldCd = 5.5;
    SFX.boost();
  }

  // Environmental forces
  // Gravity
  p.vy += cfg.gravity * 0.45 * dt;

  // Planetary wind
  if(cfg.wind){
    p.vx += cfg.wind.x * dt;
    p.vy += cfg.wind.y * dt;
  }

  // Atmospheric drag
  p.vx *= (1 - cfg.drag);
  p.vy *= (1 - cfg.drag);

  // Speed cap
  const spd = Math.hypot(p.vx, p.vy);
  const maxSpd = 660;
  if(spd > maxSpd){
    p.vx = (p.vx / spd) * maxSpd;
    p.vy = (p.vy / spd) * maxSpd;
  }

  // Low fuel warning beep
  if(getFuelPct() <= 25){
    if(Math.floor(G.t * 3) !== Math.floor((G.t - dt) * 3)){
      SFX.warn();
    }
  }

  // Position update
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // Level boundaries clamping
  p.x = clamp(p.x, 30, cfg.width - 30);
  p.y = clamp(p.y, 30, cfg.height - 30);

  // Black Hole Singularity Pull (Level 1 ONLY)
  // Stable physics calculations, capped max pull force, safe minimum distance
  if(cfg.hasHole){
    const hx = cfg.holePos.x, hy = cfg.holePos.y;
    const distHole = Math.hypot(hx - p.x, hy - p.y);
    if(distHole < cfg.holePullR && distHole > 0){
      const safeDist = Math.max(distHole, 120.0);
      const pullFactor = Math.pow(Math.max(0, 1.0 - (distHole / cfg.holePullR)), 1.35);
      const rawForce = cfg.holeForce * pullFactor;
      const cappedForce = Math.min(rawForce, 440.0);
      const pullDirX = (hx - p.x) / distHole;
      const pullDirY = (hy - p.y) / distHole;
      p.vx += pullDirX * cappedForce * dt;
      p.vy += pullDirY * cappedForce * dt;
    }
    if(distHole <= cfg.holeKillR){
      die('CONSUMED BY THE EVENT HORIZON');
      return;
    }
  }

  // Hazards collision & triggers
  for(const h of HAZARDS){
    if(h.type === 'wind'){
      if(Math.abs(p.x - h.x) < h.w/2 && Math.abs(p.y - h.y) < h.h/2){
        p.vx += h.fx * dt;
        p.vy += h.fy * dt;
      }
    } else if(h.type === 'heat' || h.type === 'acid'){
      const d = Math.hypot(p.x - h.x, p.y - h.y);
      if(d < h.r){
        G.fuel = Math.max(0, G.fuel - h.drain * dt);
        if(G.fuel <= 0 && p.inv <= 0){
          hurt(1, 'THERMAL HULL COLLAPSE');
        }
      }
    } else if(h.type === 'storm'){
      const d = Math.hypot(p.x - h.x, p.y - h.y);
      if(d < h.r){
        p.vx += (Math.random()-0.5) * 140 * dt;
        p.vy += (Math.random()-0.5) * 140 * dt;
      }
    }
  }

  // Debris physics & black hole gravitational curve
  for(let k=0; k<DEBRIS.length; k++){
    const d = DEBRIS[k];
    if(cfg.hasHole){
      const dhx = cfg.holePos.x - d.x;
      const dhy = cfg.holePos.y - d.y;
      const distD = Math.hypot(dhx, dhy);
      if(distD < cfg.holePullR * 1.25 && distD > 50){
        const pullF = Math.min(300, (1.0 - distD / (cfg.holePullR * 1.25)) * 260);
        d.vx += (dhx / distD) * pullF * dt;
        d.vy += (dhy / distD) * pullF * dt;
        // Tangential orbital swirl curving debris around singularity
        d.vx += (-dhy / distD) * (pullF * 0.35) * dt;
        d.vy += (dhx / distD) * (pullF * 0.35) * dt;
      }
    }
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.rot += d.rotSpd * dt;
    if(Math.hypot(p.x - d.x, p.y - d.y) < p.radius + d.radius){
      if(p.inv <= 0 && G.shieldT <= 0){
        hurt(1, 'DEBRIS IMPACT');
        burst(d.x, d.y, 16, '#9c9282', 180, 0.4);
      }
    }
  }

  // Collect Fuel Cells (with magnetic pull)
  for(let i=0; i<CELLS.length; i++){
    const c = CELLS[i];
    if(!c.got){
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if(d < 180 && d > 0){
        c.x = lerp(c.x, p.x, dt * 5.0);
        c.y = lerp(c.y, p.y, dt * 5.0);
      }
      if(d < 38){
        c.got = true;
        G.fuel = Math.min(getMaxFuel(), G.fuel + 16);
        G.score += 15;
        G.cellsGot++;
        SFX.fuel();
        burst(c.x, c.y, 12, C.green, 160, 0.5, true);
      }
    }
  }

  // Collect Energy Orbs (with magnetic pull)
  for(let j=0; j<ORBS.length; j++){
    const o = ORBS[j];
    if(!o.got){
      const d = Math.hypot(p.x - o.x, p.y - o.y);
      if(d < 180 && d > 0){
        o.x = lerp(o.x, p.x, dt * 5.0);
        o.y = lerp(o.y, p.y, dt * 5.0);
      }
      if(d < 42){
        o.got = true;
        G.fuel = Math.min(getMaxFuel(), G.fuel + 35);
        G.score += 50;
        G.orbsGot++;
        SFX.orb();
        burst(o.x, o.y, 20, C.gold, 220, 0.7, true);
      }
    }
  }

  // Launch Gate interaction
  GATE.rot += dt * 0.8;
  const distGate = Math.hypot(p.x - GATE.x, p.y - GATE.y);
  const minFuelNeeded = cfg.minFuel || 15;
  const hasFuel = getFuelPct() >= minFuelNeeded;
  if(distGate < GATE.radius + 30){
    if(hasFuel && (pressed('use') || pressed('thrust') || distGate < 55 || GATE.launching)){
      if(!GATE.launching){
        GATE.launching = true;
        GATE.launchT = 0;
        SFX.warp();
        const nextWorldName = PLANETS[G.worldIdx + 1]?.name || 'Next Sector';
        G.toast = { a: 'WARP SEQUENCE INITIATED', b: 'Transit to ' + nextWorldName, t: 3 };
      }
    }
  }
  if(GATE.launching){
    GATE.launchT += dt;
    G.shake = 8;
    p.vx *= 0.85;
    p.vy *= 0.85;
    p.x = lerp(p.x, GATE.x, dt * 3);
    p.y = lerp(p.y, GATE.y, dt * 3);
    burst(GATE.x, GATE.y, 6, C.cyan, 260, 0.6, true);
    if(GATE.launchT >= 2.0){
      completeLevel();
      return;
    }
  }

  // Pause key
  if(pressed('pause')){
    setThrusterRumble(false);
    G.scene = 'pause';
    SFX.click();
    return;
  }

  // Camera smooth follow
  const targetCamX = clamp(p.x - W/2, 0, cfg.width - W);
  const targetCamY = clamp(p.y - H/2, 0, cfg.height - H);
  G.camX = lerp(G.camX, targetCamX, dt * 5.0);
  G.camY = lerp(G.camY, targetCamY, dt * 5.0);

  updFx(dt);
}

function hurt(amount, reason){
  if(PL.inv > 0 || G.shieldT > 0) return;
  PL.inv = 1.2;
  G.shake = 10;

  // Emergency Recovery Penalty: drains 20 fuel to stabilize hull
  if(G.fuel > 20){
    G.fuel -= 20;
    SFX.hit();
    G.toast = { a: 'EMERGENCY RECOVERY', b: '-20% Fuel spent to stabilize hull', t: 2.5 };
  } else {
    G.hp -= amount;
    if(G.hp <= 0){
      die(reason || 'HULL INTEGRITY COMPROMISED');
    } else {
      SFX.hit();
    }
  }
}

function die(why){
  setThrusterRumble(false);
  G.deadWhy = why;
  G.scene = 'dead';
  G.shake = 16;
  SFX.boom();
}

function completeLevel(){
  setThrusterRumble(false);
  // Calculate score & credits
  const bonus = Math.floor(getFuelPct() * 2);
  G.score += bonus;
  G.credits += G.score;

  // Record best score
  if(!G.bestScores[G.worldIdx] || G.score > G.bestScores[G.worldIdx]){
    G.bestScores[G.worldIdx] = G.score;
  }

  // Unlock next world
  const next = G.worldIdx + 1;
  if(next < 10 && !G.unlockedWorlds.includes(next)){
    G.unlockedWorlds.push(next);
  }

  saveData();
  G.scene = 'level_complete';
}

/* ──────── Main Render Dispatcher ──────── */
function render(){
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  UI_BUTTONS = [];

  switch(G.scene){
    case 'title':
      renderTitle();
      break;
    case 'planets':
      renderPlanetsMenu();
      break;
    case 'upgrades':
      renderUpgradesMenu();
      break;
    case 'manual':
      renderManual();
      break;
    case 'play':
      renderWorldPlay();
      drawHUD();
      break;
    case 'pause':
      renderWorldPlay();
      renderPause();
      break;
    case 'level_complete':
      renderComplete();
      break;
    case 'dead':
      renderDead();
      break;
  }

  // Scanline CRT aesthetic
  ctx.save();
  ctx.globalAlpha = 0.025;
  ctx.fillStyle = '#000';
  for(let y=0; y<H; y+=3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
}

function renderWorldPlay(){
  const cfg = LVL;
  const shakeX = (Math.random() - 0.5) * G.shake;
  const shakeY = (Math.random() - 0.5) * G.shake;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground(cfg, G.camX, G.camY, G.t);

  // Level 1 Black Hole Singularity
  if(cfg.hasHole){
    drawBlackHole({pos: cfg.holePos, killR: cfg.holeKillR}, G.camX, G.camY, G.t);
  }

  // Hazards
  drawHazards(HAZARDS, G.camX, G.camY, G.t);

  // Debris
  for(let i=0; i<DEBRIS.length; i++) drawDebris(DEBRIS[i], G.camX, G.camY);

  // Collectibles
  for(let j=0; j<CELLS.length; j++) if(!CELLS[j].got) drawFuelCell(CELLS[j], G.camX, G.camY, G.t);
  for(let k=0; k<ORBS.length; k++) if(!ORBS[k].got) drawEnergyOrb(ORBS[k], G.camX, G.camY, G.t);

  // Launch Gate
  drawGate(GATE, G.camX, G.camY, G.t);

  // FX Particles
  drawFx(G.camX, G.camY);

  // Player (Rocket Ship in space; Character on planet)
  drawPlayer(PL, G.camX, G.camY, G.t);

  ctx.restore();
}

/* ──────── Main Loop ──────── */
let lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (ts - lastT)/1000 || 0);
  lastT = ts;
  G.t += dt;

  if(pressed('mute')){
    muted = !muted;
    if(master) master.gain.value = muted ? 0 : 0.6;
  }

  if(G.scene === 'play'){
    updatePlay(dt);
  } else if(G.scene === 'level_complete'){
    G.completeTimer = (G.completeTimer || 0) + dt;
    const nextIdx = G.worldIdx + 1;
    if(nextIdx < 10){
      if(pressed('use') || pressed('thrust') || pressed('fire') || G.completeTimer >= 4.0){
        G.completeTimer = 0;
        SFX.click();
        initFlightLevel(nextIdx);
      }
    }
  }

  render();
  pq = {};
}

/* ──────── Pointer / Touch Events ──────── */
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return [ (e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height ];
}
cv.addEventListener('pointermove', e => {
  const q = toLogical(e);
  G.mx = q[0]; G.my = q[1];
});
cv.addEventListener('pointerdown', e => {
  audioInit();
  cv.focus();
  const q = toLogical(e);
  G.mx = q[0]; G.my = q[1];

  for(let i=UI_BUTTONS.length-1; i>=0; i--){
    const u = UI_BUTTONS[i];
    if(q[0] >= u.x && q[0] <= u.x + u.w && q[1] >= u.y && q[1] <= u.y + u.h){
      u.fn();
      return;
    }
  }
});

// Loading screen tick
let loadProg = 0;
function tickLoad(){
  loadProg = Math.min(100, loadProg + 6 + (Math.random()*10|0));
  const lb = document.getElementById('lbar');
  if(lb) lb.style.width = loadProg + '%';
  if(loadProg >= 100){
    setTimeout(() => {
      const ld = document.getElementById('loader');
      if(ld) ld.classList.add('done');
      setTimeout(() => {
        if(ld) ld.style.display = 'none';
        cv.focus();
      }, 600);
    }, 250);
  } else {
    setTimeout(tickLoad, 60);
  }
}
tickLoad();

requestAnimationFrame(frame);

})();
</script>
