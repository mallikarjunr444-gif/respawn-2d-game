<style>

@keyframes borderPulse{0%,100%{box-shadow:0 0 30px rgba(61,240,255,.06),0 0 80px rgba(61,240,255,.04),inset 0 0 30px rgba(0,0,0,.3)}50%{box-shadow:0 0 40px rgba(61,240,255,.12),0 0 120px rgba(61,240,255,.06),inset 0 0 30px rgba(0,0,0,.3)}}

background:#000}
#stage::before{content:'';position:absolute;inset:-1px;border-radius:4px;border:1px solid transparent;

.tb-dir{min-width:58px;height:52px;font-size:18px}

@media (pointer:coarse), (max-width: 900px){

}

}

@media (orientation: landscape) and (max-height: 540px){
  body{padding:env(safe-area-inset-top,2px) env(safe-area-inset-right,6px) env(safe-area-inset-bottom,2px) env(safe-area-inset-left,6px);gap:2px}
  #rot-hint{display:none}
  #orvex-header{height:28px;padding:2px 10px;margin-bottom:2px}
  #stage{width:min(100%,calc((100dvh - 36px) * 1.7778));height:calc(100dvh - 36px);position:relative}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:40;max-width:100%;padding:max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));justify-content:space-between;align-items:flex-end}
  .pad-left,.pad-center,.pad-right{pointer-events:auto}

  .tb{background:linear-gradient(180deg,rgba(13,20,51,.7),rgba(7,10,26,.85));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
}

<script>
(()=>{
'use strict';
const W=960,H=540,GY=430;
const C={void:'#070a1a',navy:'#0d1433',violet:'#3b2a7a',cyan:'#3df0ff',ember:'#ff7a2e',bone:'#e9eefc',pink:'#ff5fa8',gold:'#ffd166',green:'#5dffb0',dim:'#8d97c4'};
const F_D="'Syncopate','Arial Black',Impact,sans-serif",F_U="'Chakra Petch','Segoe UI',system-ui,sans-serif";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const r=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth||W;cv.width=Math.round(w*r);cv.height=Math.round(w*r*H/W);}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,mod=(a,n)=>((a%n)+n)%n;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,col,align,font,weight,ls){ctx.font=(weight||600)+' '+size+'px '+(font||F_U);ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';try{ctx.letterSpacing=(ls||0)+'px';}catch(e){}ctx.fillText(s,x,y);try{ctx.letterSpacing='0px';}catch(e){}}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||'null');}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}


const fsBtn = document.getElementById("fs-btn");
if(fsBtn){
  fsBtn.addEventListener("click", () => {
    if(!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
      fsBtn.textContent = "✕";
    } else {
      document.exitFullscreen().catch(()=>{});
      fsBtn.textContent = "⛶";
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if(fsBtn) fsBtn.textContent = document.fullscreenElement ? "✕" : "⛶";
  });
}

/* ---------- input ---------- */
const MAP={arrowleft:['left'],a:['left'],arrowright:['right'],d:['right'],arrowup:['jump','up'],w:['jump','up'],' ':['jump','enter'],arrowdown:['down'],s:['down'],shift:['dash'],l:['dash'],j:['atk'],x:['atk'],e:['use'],f:['use'],enter:['enter'],escape:['esc'],m:['mute'],h:['hint'],r:['retry'],'1':['n1'],'2':['n2'],'3':['n3'],q:['shield'],k:['shoot'],z:['shoot']};
let held={},pq={};
const pressed=a=>!!pq[a];
function press(a){if(!held[a])pq[a]=true;held[a]=true;}
function release(a){held[a]=false;}
addEventListener('keydown',e=>{const k=MAP[e.key.toLowerCase()];if(!k)return;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase()))e.preventDefault();audioInit();if(!e.repeat)k.forEach(press);});
addEventListener('keyup',e=>{const k=MAP[e.key.toLowerCase()];if(k)k.forEach(release);});
addEventListener('blur',()=>{held={};});
document.querySelectorAll('.tb').forEach(b=>{
  const a=b.dataset.k;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch(err){}
    audioInit();
    if(navigator.vibrate)try{navigator.vibrate(15);}catch(v){}
    press(a);
    if(a==='use'||a==='jump')press('enter');
    b.classList.add('on');
  });
  const onUp=(e)=>{
    try{b.releasePointerCapture(e.pointerId);}catch(err){}
    release(a);
    if(a==='use'||a==='jump')release('enter');
    b.classList.remove('on');
  };
  b.addEventListener('pointerup',onUp);
  b.addEventListener('pointercancel',onUp);
});

// Mobile Web Audio unlock
['touchstart','touchend','pointerdown'].forEach(ev=>{
  window.addEventListener(ev,()=>{
    if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
    else if(!AC)audioInit();
  },{passive:true});
});

/* ---------- audio (synthesized) ---------- */
let AC=null,master=null,droneG=null,muted=false;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
const o1=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter();o1.type=o2.type='sawtooth';o1.frequency.value=41;o2.frequency.value=41.8;lp.type='lowpass';lp.frequency.value=150;droneG=AC.createGain();droneG.gain.value=.03;o1.connect(lp);o2.connect(lp);lp.connect(droneG);droneG.connect(master);o1.start();o2.start();}catch(e){AC=null;}}
function tone(f,d,type,v,slide){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v,fc){if(!AC||muted)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||800;const g=AC.createGain();g.gain.value=v||.15;s.connect(f);f.connect(g);g.connect(master);s.start();}catch(e){}}
const SFX={jump(){tone(300,.16,'square',.05,2)},dash(){noise(.18,.12,1800)},swing(){tone(760,.16,'sawtooth',.06,.4)},hit(){tone(180,.14,'square',.1,.5);noise(.1,.1,600)},gem(){tone(880,.1,'sine',.09,1.6)},boom(){noise(.5,.25,260);tone(70,.4,'sine',.2,.4)},hurt(){tone(220,.25,'sawtooth',.12,.4)},click(){tone(520,.05,'square',.05)},ok(){tone(520,.12,'sine',.1,1.5);setTimeout(()=>tone(780,.2,'sine',.1,1.4),110)}};

/* ---------- particles (enhanced with glow trails) ---------- */
const P=[];
function spawn(x,y,vx,vy,life,size,col,grav,add){if(P.length>800)P.shift();P.push({x,y,vx,vy,life,max:life,size,col,grav:grav||0,add:!!add,ox:x,oy:y});}
function burst(x,y,n,col,spd,life,add){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random()*.7);spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,life*(.5+Math.random()*.5),2+Math.random()*3.5,col,300,add);}}
function updFx(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}p.ox=p.x;p.oy=p.y;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawFx(cam){ctx.save();for(const p of P){const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a*(p.add?.85:1);ctx.globalCompositeOperation=p.add?'lighter':'source-over';const sz=p.size*(p.add?1:clamp(a,.3,1));
if(p.add&&sz>3){const glow=ctx.createRadialGradient(p.x-cam,p.y,0,p.x-cam,p.y,sz*3);glow.addColorStop(0,p.col);glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.globalAlpha=a*.35;ctx.fillRect(p.x-cam-sz*3,p.y-sz*3,sz*6,sz*6);ctx.globalAlpha=a*.85;}
ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-cam,p.y,sz,0,6.283);ctx.fill();
if(p.add&&Math.abs(p.vx)>40){ctx.globalAlpha=a*.3;ctx.strokeStyle=p.col;ctx.lineWidth=sz*.6;ctx.beginPath();ctx.moveTo(p.ox-cam,p.oy);ctx.lineTo(p.x-cam,p.y);ctx.stroke();}}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.restore();}

function drawDust(cam,t){ctx.save();ctx.globalCompositeOperation='lighter';for(const d of DUST){const x=mod(d.x-cam*.03+Math.sin(t*.5+d.ph)*8,W+40)-20;const y=d.y+Math.sin(t*d.sp+d.ph)*6;ctx.globalAlpha=d.a*(.5+.5*Math.sin(t*d.sp*2+d.ph));ctx.fillStyle='rgba(200,210,255,.6)';ctx.beginPath();ctx.arc(x,y,d.sz,0,6.283);ctx.fill();}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.restore();}

   forgeX:2850,barrierX:3600,padX:4250,cps:[180,1900,2700],holeSpeed:105,meteorEvery:2.6,
   packs:[{x:2120,y:296},{x:3310,y:256}],enemies:[3150,3380,3880,4060].map((x,i)=>({cx:x,range:90,ph:i*1.7,spd:1.3}))};

  L.segs.forEach(s=>{for(let x=Math.max(s[0],250)+80;x<s[1]-60;x+=140){if(r()<.5&&Math.abs(x-L.forgeX)>110&&Math.abs(x-L.barrierX)>110&&Math.abs(x-L.padX)>110)L.crystals.push({x,y:GY-34});}});
 } else {
  const r=rng(1000+n*77+(Math.random()*1e6|0));
  const th=ENDLESS[n%5],len=3000+Math.min(n,8)*350,segs=[],plats=[];
  let x=-800;segs.push([x,700]);x=700;
  while(x<len){const gap=95+r()*(30+Math.min(n,6)*6),sx=x+gap;let ex=sx+320+r()*380;if(len-ex<420)ex=len;segs.push([sx,ex]);plats.push({x:x+gap/2-35,y:360,w:70});x=ex;if(ex>=len)break;}
  segs.forEach(s=>{if(s[1]-s[0]>520&&s[0]>0)plats.push({x:(s[0]+s[1])/2-60,y:290+r()*40,w:th===TH.shatter?90:120});});
  L={kind,name:'SECTOR '+(n+1)+' — '+th.name,theme:th,L:len,startX:180,segs,plats,forgeX:null,barrierX:null,padX:len-200,cps:[180],
   holeSpeed:Math.min(170,100+n*8),meteorEvery:Math.max(1.1,2.2-n*.12),packs:[],enemies:[],crystals:[]};
  const ec=Math.min(2+n,10);
  for(let i=0;i<ec;i++){const s=segs[1+Math.floor(r()*(segs.length-1))];if(s[1]-s[0]>260&&s[0]>800)L.enemies.push({cx:s[0]+130+r()*(s[1]-s[0]-260),range:60+r()*70,ph:r()*6,spd:1.2+r()*.8+(th===TH.horizon?.8:0)});}
  plats.forEach(p=>{for(let i=0;i<3;i++)L.crystals.push({x:p.x+p.w*(i+.5)/3,y:p.y-30});});
  segs.forEach(s=>{for(let x=Math.max(s[0],300)+90;x<s[1]-60;x+=150)if(r()<.4)L.crystals.push({x,y:GY-34});});
  if(n%2===1&&plats.length>3){const p=plats[2];L.packs.push({x:p.x+p.w/2,y:p.y-30});}
 }
 L.crystals.forEach(c=>c.got=false);L.packs.forEach(c=>c.got=false);
 L.enemies.forEach(e=>{e.hp=2;e.dead=false;e.hitT=0;e.sx=e.cx;e.sy=GY-74;e.dir=1;e.swing=-1;});
 L.solids=L.segs.map(s=>({x0:s[0],x1:s[1],y:GY})).concat(L.plats.map(p=>({x0:p.x,x1:p.x+p.w,y:p.y})));
 return L;
}

function ridge(cam,f,base,amp,col,s){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-10,H);for(let x=-10;x<=W+10;x+=12){const wx=x+cam*f;ctx.lineTo(x,base-amp*(.5+.5*Math.sin(wx*.004+s))-amp*.4*Math.sin(wx*.011+s*2)+Math.sin(wx*.05)*3);}ctx.lineTo(W+10,H);ctx.closePath();ctx.fill();}
function drawBG(th,cam,t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
 /* enhanced volumetric nebula clouds with layered depth */
 for(let i=0;i<6;i++){const nx=mod(i*350-cam*(.03+i*.008),W+800)-400,ny=80+i*60+Math.sin(t*(.08+i*.02)+i)*15;const sz=280+i*40;const gr=ctx.createRadialGradient(nx,ny,10,nx,ny,sz);gr.addColorStop(0,th.neb[i%2]);gr.addColorStop(.6,th.neb[(i+1)%2]?.replace('.3','.08')?.replace('.35','.06')||'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(nx-sz,ny-sz,sz*2,sz*2);}
 /* enhanced parallax star field with twinkling */
 for(let l=0;l<3;l++){const f=[.02,.06,.12][l];for(const s of STARS[l]){const x=mod(s.x-cam*f,W+40)-20;const twinkle=.35+.65*(.5+.5*Math.sin(t*s.sp+s.ph));ctx.globalAlpha=twinkle*(l===0?.6:1);
 if(l===2&&twinkle>.85){ctx.fillStyle='#fff';ctx.globalAlpha=twinkle*.3;ctx.beginPath();ctx.arc(x,s.y,s.r*4,0,6.283);ctx.fill();ctx.globalAlpha=twinkle;}
 ctx.fillStyle=l===2?'#e8eeff':l===1?'#d4e4ff':'#fff';ctx.fillRect(x-.5,s.y,s.r,s.r);
 if(l===2){ctx.fillRect(x+s.r/2-2,s.y-2,1,s.r+4);ctx.fillRect(x-2,s.y+s.r/2-.5,s.r+4,1);}}}
 ctx.globalAlpha=1;

 ctx.save();ctx.globalCompositeOperation='lighter';const atm=ctx.createRadialGradient(px,py,56,px,py,100);atm.addColorStop(0,th.planet+'44');atm.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=atm;ctx.beginPath();ctx.arc(px,py,100,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.restore();
 const pg=ctx.createRadialGradient(px-20,py-20,6,px,py,66);pg.addColorStop(0,th.planet);pg.addColorStop(1,'#10081f');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,64,0,6.283);ctx.fill();
 /* planet surface detail */

 ctx.globalAlpha=.12;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(px-64,py-10,128,18);ctx.fillRect(px-64,py+20,128,10);
 const hl=ctx.createRadialGradient(px-20,py-25,4,px,py,64);hl.addColorStop(0,'rgba(255,255,255,.25)');hl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hl;ctx.globalAlpha=1;ctx.fillRect(px-64,py-64,128,128);
 ctx.restore();

function drawGround(L,cam,th){
 for(const s of L.segs){if(s[1]<cam-30||s[0]>cam+W+30)continue;const x0=s[0]-cam,x1=s[1]-cam;
  const g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,th.rock[0]);g.addColorStop(1,th.rock[1]);ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x0,GY);ctx.lineTo(x1,GY);ctx.lineTo(x1,GY+30);ctx.lineTo(x1-10,GY+60);ctx.lineTo(x1-2,GY+90);ctx.lineTo(x1-16,H+2);ctx.lineTo(x0+16,H+2);ctx.lineTo(x0+2,GY+90);ctx.lineTo(x0+10,GY+60);ctx.lineTo(x0,GY+30);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;const r=rng(Math.floor(s[0])+5);ctx.beginPath();for(let i=0;i<8;i++){const cx=x0+r()*(x1-x0),cy=GY+20+r()*70;ctx.moveTo(cx,cy);ctx.lineTo(cx+r()*40-20,cy+r()*30);}ctx.stroke();
  ctx.fillStyle=th.rock[0];for(let x=Math.max(x0,-20);x<Math.min(x1,W+20);x+=70){const h=3+((Math.floor((x+cam)/70)*37)%7);rr(x+6,GY-h,20,h,3);ctx.fill();}
  ctx.strokeStyle=th.rim;ctx.globalAlpha=.25;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x0,GY);ctx.lineTo(x1,GY);ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=3;ctx.stroke();}
 for(const p of L.plats){if(p.x+p.w<cam-20||p.x>cam+W+20)continue;const x=p.x-cam,g=ctx.createLinearGradient(0,p.y,0,p.y+18);g.addColorStop(0,th.rock[0]);g.addColorStop(1,th.rock[1]);
  const gl=ctx.createRadialGradient(x+p.w/2,p.y+22,2,x+p.w/2,p.y+22,p.w*.6);gl.addColorStop(0,th.rim+'66');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(x-20,p.y,p.w+40,70);

 const suit=fem?'#e4dcff':'#d4e8ff',dark=fem?'#2a1f55':'#16264f',acc=fem?C.pink:C.cyan,ph=t*13;

const PZ={cols:6,rows:5,cs:72,gx:70,gy:122,src:[0,3],tgt:[5,4],

function mirrorInit(){return{type:'mirror',m:Object.assign({},PZ.init),idle:0,hint:null,hintT:0,solved:false,st:0};}
function pzTrace(m){const pts=[[PZ.src[0],PZ.src[1]]];let c=PZ.src[0],r=PZ.src[1],dx=1,dy=0,hit=false;
 for(let i=0;i<40;i++){c+=dx;r+=dy;pts.push([c,r]);if(c<0||c>=PZ.cols||r<0||r>=PZ.rows)break;if(c===PZ.tgt[0]&&r===PZ.tgt[1]){hit=true;break;}
  const mm=m[c+','+r];if(mm==='/'){const a=-dy,b=-dx;dx=a;dy=b;}else if(mm==='\\'){const a=dy,b=dx;dx=a;dy=b;}}
 return{pts,hit};}

function mirrorClick(mx,my){const z=G.pz;const c=Math.floor((mx-PZ.gx)/PZ.cs),r=Math.floor((my-PZ.gy)/PZ.cs),k=c+','+r;

function updatePuzzle(dt){const z=G.pz;z.idle+=dt;if(z.err>0)z.err-=dt;z.hintT-=dt;if(z.hintT<=0)z.hint=null;if(z.idle>12&&!z.hint&&!z.solved)pzHint();

const SYM_ROUNDS=[{seq:[0,1,2,0,1],ans:2},{seq:[0,0,1,1,2,2,0,0],ans:1}];
function symInit(){return{type:'symbol',round:0,idle:0,hint:false,hintT:0,solved:false,st:0,err:0,wrong:0,order:[[1,3,0,2],[3,1,2,0]]};}
function symClick(mx,my){const z=G.pz,i=Math.floor((mx-70)/110);if(my<320||my>410||i<0||i>3||(mx-70)%110>90)return;const s=z.order[z.round][i];z.idle=0;
 if(s===SYM_ROUNDS[z.round].ans){z.round++;z.hint=false;z.wrong=0;SFX.gem();if(z.round>=2){z.solved=true;z.st=0;SFX.ok();G.shake=6;}}
 else{z.wrong++;z.err=.5;SFX.hurt();if(z.wrong>=2){z.hint=true;z.hintT=4;}}}
const SEQX=300,SEQY=300,SEQ_PL=[{r:55,sp:1.3,ph:0,sz:9,col:'#ffd166'},{r:95,sp:.9,ph:2,sz:12,col:'#ff5fa8'},{r:135,sp:.65,ph:4,sz:15,col:'#3df0ff'},{r:175,sp:.45,ph:1,sz:18,col:'#5dffb0'}];
function seqPos(i){const q=SEQ_PL[i],a=G.t*q.sp+q.ph;return[SEQX+Math.cos(a)*q.r,SEQY+Math.sin(a)*q.r*.62];}
function seqInit(){return{type:'seq',order:G.lvl.order==='out'?[3,2,1,0]:[0,1,2,3],next:0,lit:[],idle:0,hint:false,hintT:0,solved:false,st:0,err:0};}

  if(i===z.order[z.next]&&!z.lit.includes(i)){z.lit.push(i);z.next++;SFX.gem();if(z.next>=4){z.solved=true;z.st=0;SFX.ok();G.shake=6;}}
  else{z.lit=[];z.next=0;z.err=.5;SFX.hurt();}return;}}}

 const a=clamp((lt-2.3)/1.3,0,1);ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fillRect(0,0,W,H);
}
// ------- cinematic world-reveal scene -------
const WORLD_REVEALS=[
 null,
 {title:'AETHER-7',lines:['A crystalline world orbiting a dying star.','Rumours of a weapon forge — and something guarding it.']},
 {title:'CINDER MOON',lines:['The vents erupt without warning.','Decode the armory before the heat takes you.']},
 {title:'CRYOS',lines:['Three research stations. All silent.','Logs recovered. They knew about the Devourer.']},
 {title:'VORTEX PRIME',lines:['Gravity is wrong here. Platforms drift.','A Guardian stands between you and the last weapon.']},
 {title:'EARTH',lines:['You made it.','But the signal in your pod made it first.']},
];
function renderReveal(){
 const rv=G.reveal,t=G.revealT;if(!rv)return;
 drawBG(G.lvl.theme,t*20,G.t);
 ctx.fillStyle='rgba(3,5,16,.78)';ctx.fillRect(0,0,W,H);
 const a=clamp(t/1.1,0,1);ctx.globalAlpha=a;
 txt(rv.title,W/2,200,44,C.cyan,'center',F_D,700,4);
 rv.lines.forEach((l,i)=>txt(l,W/2,268+i*30,17,C.bone,'center',F_U,600,1));
 const prog=clamp((t-3.5)/.8,0,1);if(prog>0){txt('ENTERING SECTOR — STAND BY',W/2,370,13,C.ember,'center',F_U,700,3);ctx.fillStyle='rgba(255,255,255,.08)';rr(W/2-150,390,300,6,3);ctx.fill();ctx.fillStyle=C.ember;rr(W/2-150,390,300*prog,6,3);ctx.fill();}
 ctx.globalAlpha=1;
}
function renderEnd(){
 const t=G.t;drawBG(TH.earth,t*10,t);const px=700,py=250;
 const g=ctx.createRadialGradient(px-40,py-40,10,px,py,150);g.addColorStop(0,'#bfe8ff');g.addColorStop(.5,'#2a6fc4');g.addColorStop(1,'#06142e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,150,0,6.283);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(px,py,150,0,6.283);ctx.clip();for(let i=0;i<7;i++){ctx.fillStyle=i%2?'rgba(93,255,176,.28)':'rgba(255,255,255,.18)';ctx.fillRect(px-150,py-140+i*40+Math.sin(t*.3+i)*4,300,12);}
 const sh=ctx.createLinearGradient(px-150,0,px+150,0);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=sh;ctx.fillRect(px-150,py-150,300,300);ctx.restore();
 ctx.fillStyle='#cfd3e6';ctx.beginPath();ctx.arc(px-230,py-120,16,0,6.283);ctx.fill();
 const gl=ctx.createLinearGradient(0,0,W*.62,0);gl.addColorStop(0,'rgba(5,7,26,.85)');gl.addColorStop(1,'rgba(5,7,26,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
 txt('CAMPAIGN COMPLETE',54,110,13,C.ember,'left',F_U,700,5);txt('EARTH',54,170,48,C.bone,'left',F_D,700,4);
 txt('You reached Earth. The Devourer was never chasing you.',54,215,16,C.bone,'left',F_U,600);txt('It was following the signal in your pod.',54,239,16,C.bone,'left',F_U,600);
 txt('Beyond the galaxy, something answers.',54,263,16,C.cyan,'left',F_U,700);
 txt('CRYSTALS  '+G.crystals+'     VOIDLINGS  '+G.kills+'     TIME  '+Math.floor(G.time)+'s',54,310,14,C.dim,'left',F_U,700,2);
 btn('INFINITE FRONTIER',54,345,300,46,startEndless,{sel:true});btn('PLAY AGAIN',54,401,300,46,startStory);btn('MENU',54,457,300,46,()=>{G.scene='title';});
}
function render(){
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.clearRect(0,0,W,H);UI=[];
 switch(G.scene){case'title':renderTitle();break;case'select':renderSelect();break;case'play':renderWorld(true);drawHUD();drawHUD2();drawMinimap();break;case'puzzle':renderPuzzle();break;case'dead':renderDead();break;case'launch':renderLaunch();break;case'reveal':renderReveal();break;case'end':renderEnd();break;}
 if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+clamp(G.fade,0,1)+')';ctx.fillRect(0,0,W,H);}
 if(G.muted){rr(W-80,H-24,70,18,4);ctx.fillStyle='rgba(13,20,51,.7)';ctx.fill();ctx.strokeStyle='rgba(141,151,196,.3)';ctx.lineWidth=1;ctx.stroke();txt('MUTED',W-45,H-10,10,C.dim,'center',F_U,700,2);}
 /* subtle scanline overlay for CRT feel */
 ctx.save();ctx.globalAlpha=.025;ctx.fillStyle='rgba(0,0,0,1)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);ctx.globalAlpha=1;ctx.restore();
}

/* ---------- loop & pointer ---------- */
function update(dt){
 if(G.fade>0&&G.scene!=='launch')G.fade=Math.max(0,G.fade-dt*2);
 if(pressed('mute')){muted=!muted;G.muted=muted;if(master)master.gain.value=muted?0:.55;}
 switch(G.scene){
  case'title':{const n=G.menuN||2;if(pressed('down'))G.menu=Math.min(n-1,G.menu+1);if(pressed('up'))G.menu=Math.max(0,G.menu-1);if(pressed('n1'))G.menu=0;if(pressed('n2'))G.menu=1;if(pressed('n3')&&n>2)G.menu=2;
   if(pressed('enter')||pressed('n1')||pressed('n2')||(pressed('n3')&&n>2)){const sv=store('eh_save');G.nextMode=G.menu===1?'endless':'story';G.startWorld=G.menu===2&&sv?sv.world:0;G.scene='select';SFX.click();}break;}
  case'select':if(pressed('left'))G.char='male';if(pressed('right'))G.char='female';if(pressed('esc')){G.scene='title';}
   if(pressed('enter')){if(G.nextMode==='endless')startEndless();else startStory(G.startWorld||0);}break;
  case'play':updatePlay(dt);break;
  case'puzzle':updatePuzzle(dt);break;
  case'dead':G.deadT+=dt;G.shake=Math.max(0,G.shake-dt*30);updFx(dt);if(G.deadT>.8&&(pressed('enter')||pressed('retry')))retry();break;
  case'launch':G.lt+=dt;G.shake=Math.max(4,G.shake);for(let i=0;i<3;i++)spawn(G.lvl.padX+Math.random()*30-15,GY-8-G.lt*G.lt*90+10,Math.random()*80-40,120+Math.random()*100,.6,5,'#ff9a3c',0,true);updFx(dt);if(G.lt>4.1){if(G.lvl.final){G.scene='end';G.fade=1;}else nextWorldReveal();}break;
  case'reveal':G.revealT+=dt;if((G.revealT>5.2&&(pressed('enter')||pressed('esc')))||G.revealT>6.5){G.revealT=0;G.reveal=null;nextWorld();}break;
  case'end':G.fade=Math.max(0,G.fade-dt);break;
 }
}
function nextWorldReveal(){
 const w=G.world+1;const rv=WORLD_REVEALS[w];
 if(rv){G.reveal=rv;G.revealT=0;G.scene='reveal';// pre-load level theme for reveal background
 const wc=({aether:TH.aether,cinder:TH.cinder,cryos:TH.cryos,vortex:TH.vortex,earth:TH.earth});
 const wds=[null,{th:'aether'},{th:'cinder'},{th:'cryos'},{th:'vortex'},{th:'earth'}];
 if(wds[w])G.lvl={...G.lvl,theme:wc[wds[w].th]};
 }else nextWorld();
}
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;G.t+=dt;update(dt);render();pq={};}
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointermove',e=>{const q=toLogical(e);G.mx=q[0];G.my=q[1];});
cv.addEventListener('pointerdown',e=>{audioInit();cv.focus();const q=toLogical(e);G.mx=q[0];G.my=q[1];
 if(G.scene==='puzzle'&&G.pz&&!UI.some(u=>q[0]>=u.x&&q[0]<=u.x+u.w&&q[1]>=u.y&&q[1]<=u.y+u.h)){pzClick(q[0],q[1]);return;}
 for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(q[0]>=u.x&&q[0]<=u.x+u.w&&q[1]>=u.y&&q[1]<=u.y+u.h){u.fn();return;}}
 if(G.scene==='dead'&&G.deadT>.8)retry();});
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
document.fonts&&document.fonts.load&&['700 20px Syncopate','600 14px "Chakra Petch"','700 14px "Chakra Petch"','900 28px Orbitron'].forEach(f=>document.fonts.load(f).catch(()=>{}));
requestAnimationFrame(frame);
})();
