<script>
(()=>{
'use strict';

const W = 960, H = 540;
const C = {
  void: '#040614', navy: '#0b1432', cyan: '#3df0ff', ember: '#ff7a2e',
  gold: '#ffd166', green: '#3dff88', bone: '#eaf0fc', dim: '#8e98c7',
  red: '#ff3d5a', purple: '#ba68f8', teal: '#62ffd1', ice: '#6be7ff', toxic: '#b5ff40'
};
const F_D = "'Syncopate','Arial Black',sans-serif", F_U = "'Chakra Petch','Segoe UI',sans-serif", F_O = "'Orbitron',sans-serif";

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit(){
  const r = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth || W;
  cv.width = Math.round(w * r);
  cv.height = Math.round(w * r * H / W);
}
addEventListener('resize', fit);
fit();

const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;
const mod = (a,n) => ((a%n)+n)%n;
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else ctx.rect(x,y,w,h);
}
function txt(s,x,y,size,col,align,font,weight,ls){
  ctx.font = (weight||600) + ' ' + size + 'px ' + (font||F_U);
  ctx.fillStyle = col;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  try{ ctx.letterSpacing = (ls||0) + 'px'; }catch(e){}
  ctx.fillText(s, x, y);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
}
function store(k,v){
  try{
    if(v === undefined) return JSON.parse(localStorage.getItem(k)||'null');
    localStorage.setItem(k, JSON.stringify(v));
  }catch(e){ return null; }
}

/* ──────── Full Asset Image Loader ──────── */
const ASSET_IMAGES = {};
[
  'assets/planets/fractured_moon.svg',
  'assets/planets/aether_7.svg',
  'assets/planets/cinder_moon.svg',
  'assets/planets/cryos.svg',

  'assets/planets/earth.svg',
  'assets/backgrounds/world1_fractured_moon.svg',

});

/* ──────── Procedural Sci-Fi Synthesizer ──────── */
let AC = null, master = null, thrusterGain = null, thrusterOsc = null, muted = false;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(AC.destination);

    thrusterOsc = AC.createOscillator();
    const lp = AC.createBiquadFilter();
    thrusterGain = AC.createGain();
    thrusterOsc.type = 'triangle';
    thrusterOsc.frequency.value = 52;
    lp.type = 'lowpass';
    lp.frequency.value = 170;
    thrusterGain.gain.value = 0.0001;
    thrusterOsc.connect(lp);
    lp.connect(thrusterGain);
    thrusterGain.connect(master);
    thrusterOsc.start();
  }catch(e){ AC = null; }
}
function setThrusterRumble(active){
  if(!AC || !thrusterGain) return;
  const target = active ? 0.09 : 0.0001;
  thrusterGain.gain.setTargetAtTime(target, AC.currentTime, 0.05);
}
function tone(f,d,type,v,slide){
  if(!AC || muted) return;
  try{
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(v || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + d + 0.02);
  }catch(e){}
}
function noise(d,v,fc){
  if(!AC || muted) return;
  try{
    const n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
    for(let i=0; i<n; i++) a[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc || 800;
    const g = AC.createGain(); g.gain.value = v || 0.16;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  }catch(e){}
}
const SFX = {
  boost(){ noise(0.25, 0.2, 1200); tone(140, 0.25, 'sawtooth', 0.14, 2.5); },
  fuel(){ tone(580, 0.1, 'sine', 0.14, 1.4); setTimeout(()=>tone(880, 0.16, 'sine', 0.14, 1.2), 65); },
  orb(){ tone(660, 0.12, 'triangle', 0.16, 1.3); setTimeout(()=>tone(990, 0.18, 'sine', 0.16, 1.5), 80); setTimeout(()=>tone(1320, 0.22, 'sine', 0.16), 160); },
  warn(){ tone(480, 0.08, 'square', 0.12); setTimeout(()=>tone(380, 0.1, 'square', 0.12), 85); },
  warp(){ noise(0.8, 0.35, 320); tone(90, 0.7, 'sine', 0.28, 6.5); },
  hit(){ tone(180, 0.14, 'sawtooth', 0.15, 0.5); noise(0.1, 0.15, 500); },
  boom(){ noise(0.65, 0.32, 220); tone(60, 0.55, 'sine', 0.26, 0.3); },
  click(){ tone(540, 0.04, 'square', 0.06); },
  sword(){ noise(0.14, 0.22, 1600); tone(680, 0.12, 'sawtooth', 0.18, 0.35); },
  blaster(){ tone(920, 0.08, 'sawtooth', 0.15, 0.25); tone(460, 0.11, 'square', 0.09, 0.5); },
  land(){ tone(130, 0.3, 'sine', 0.25, 0.4); noise(0.35, 0.2, 450); },
  takeoff(){ noise(0.95, 0.38, 260); tone(75, 0.85, 'sawtooth', 0.28, 3.5); },
  door(){ tone(340, 0.14, 'sine', 0.12, 1.5); noise(0.18, 0.1, 950); },
  resource(){ tone(520, 0.12, 'sine', 0.16, 1.4); setTimeout(()=>tone(780, 0.16, 'sine', 0.16, 1.3), 80); setTimeout(()=>tone(1100, 0.22, 'triangle', 0.18), 160); },
  rcs(){ noise(0.09, 0.08, 2200); tone(85, 0.08, 'sine', 0.06); }
};

/* ──────── Input System ──────── */
const MAP = {
  arrowleft: ['left'], a: ['left'],
  arrowright: ['right'], d: ['right'],
  arrowup: ['up', 'thrust'], w: ['up', 'thrust'],
  arrowdown: ['down'], s: ['down'],
  ' ': ['thrust'],
  shift: ['boost'],
  e: ['use'], enter: ['use', 'enter'],
  q: ['shield'],
  j: ['atk'], x: ['atk'],
  k: ['shoot'], z: ['shoot'],
  p: ['pause'], escape: ['pause', 'esc'],
  m: ['mute'], r: ['retry']
};
let held = {}, pq = {};
const pressed = a => !!pq[a];
function press(a){ if(!held[a]) pq[a]=true; held[a]=true; }
function release(a){ held[a]=false; }

addEventListener('keydown', e => {
  const k = MAP[e.key.toLowerCase()];
  if(!k) return;
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
  audioInit();
  if(!e.repeat) k.forEach(press);
});
addEventListener('keyup', e => {
  const k = MAP[e.key.toLowerCase()];
  if(k) k.forEach(release);
});
addEventListener('blur', () => { held={}; });

document.querySelectorAll('.tb').forEach(b => {
  const a = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ b.setPointerCapture(e.pointerId); }catch(err){}
    audioInit();
    press(a);
    b.classList.add('on');
  });
  const onUp = (e) => {
    try{ b.releasePointerCapture(e.pointerId); }catch(err){}
    release(a);
    b.classList.remove('on');
  };
  b.addEventListener('pointerup', onUp);
  b.addEventListener('pointercancel', onUp);
});

cv.addEventListener('mousedown', e => {
  audioInit();
  if(e.button === 0) press('atk');
  else if(e.button === 2) press('shoot');
});
cv.addEventListener('mouseup', e => {
  if(e.button === 0) release('atk');
  else if(e.button === 2) release('shoot');
});
cv.addEventListener('contextmenu', e => e.preventDefault());

['touchstart','touchend','pointerdown'].forEach(ev => {
  window.addEventListener(ev, () => {
    if(AC && AC.state==='suspended') AC.resume().catch(()=>{});
    else if(!AC) audioInit();
  }, {passive:true});
});

/* ──────── Particle & Visual FX System ──────── */
const P = [];
function spawn(x,y,vx,vy,life,size,col,grav,add){
  if(P.length > 950) P.shift();
  P.push({x,y,vx,vy,life,max:life,size,col,grav:grav||0,add:!!add,ox:x,oy:y});
}
function burst(x,y,n,col,spd,life,add){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = spd * (0.3 + Math.random()*0.7);
    spawn(x,y,Math.cos(a)*s, Math.sin(a)*s, life*(0.5+Math.random()*0.5), 2+Math.random()*3, col, 0, add);
  }
}
function updFx(dt){
  for(let i=P.length-1;i>=0;i--){
    const p = P[i];
    p.life -= dt;
    if(p.life <= 0){ P.splice(i,1); continue; }
    p.ox = p.x; p.oy = p.y;
    p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}
function drawFx(camX, camY){
  ctx.save();
  for(const p of P){
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a * (p.add ? 0.9 : 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y - camY, p.size * clamp(p.life / p.max, 0.25, 1), 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ──────── Planet Level Initializer ──────── */
function initPlanet(worldIdx){
  G.worldIdx = worldIdx;
  const cfg = PLANETS[worldIdx];
  LVL = cfg;

  document.getElementById('header-planet-title').textContent = cfg.name + ' · ' + cfg.type;

  G.fuel = Math.max(G.fuel || 0, getMaxFuel() * 0.65);
  G.oxygen = 100;
  G.hp = 3;
  G.cellsGot = 0;
  G.orbsGot = 0;
  G.shieldT = 0;
  G.shieldCd = 0;
  G.phase = 'flight';
  G.phaseTimer = 0;

  P.length = 0;
  BULLETS = [];

  PL = {
    x: cfg.rocketStart.x,
    y: cfg.rocketStart.y,
    vx: cfg.rocketStart.vx,
    vy: cfg.rocketStart.vy,
    angle: cfg.rocketStart.angle || 0,
    face: 1,
    thrusting: false,
    thrustingUp: false,
    thrustingDown: false,
    thrustingHoriz: 0,
    boosting: false,
    boostCd: 0,
    boostT: 0,
    inv: 1.0,
    radius: 20,
    onGround: false,
    coyote: 0,
    suit: 100,
    oxygen: 100,
    walkCycle: 0,
    bodyTilt: 0,
    atkT: 0,
    atkCd: 0,
    shootCd: 0
  };

  CELLS = [];
  ORBS = [];
  PLATFORMS = [];
  ENEMIES = [];
  HAZARDS = [];
  DEBRIS = [];

  const r = rng(310 + worldIdx * 43);

  // Ground solid base
  PLATFORMS.push({x: 0, y: cfg.groundY, w: cfg.width, h: cfg.height - cfg.groundY, kind: 'ground'});

  // Landing pad platform at start
  PLATFORMS.push({
    x: cfg.landingPad.x - 40,
    y: cfg.landingPad.y,
    w: cfg.landingPad.w + 80,
    h: 28,
    kind: 'landing_pad'
  });

  // Departure rocket launch gantry platform at far right
  PLATFORMS.push({
    x: cfg.departureRocket.x - 50,
    y: cfg.departureRocket.y + cfg.departureRocket.h - 10,
    w: cfg.departureRocket.w + 100,
    h: 30,
    kind: 'launch_pad'
  });

  // Intermediate exploration platforms
  const platformCount = cfg.movingPlatforms ? 22 : 18;
  for(let q=0; q<platformCount; q++){
    const t = (q + 1) / (platformCount + 1);
    const startX = cfg.landingPad.x + 300;
    const endX = cfg.departureRocket.x - 300;
    const px = lerp(startX, endX, t) + (r() - 0.5) * 160;
    const py = clamp(cfg.groundY - 140 - (r() * 480) - (cfg.updrafts ? r()*240 : 0), 420, cfg.groundY - 90);
    const moving = cfg.movingPlatforms && q % 3 === 1;
    const cracking = cfg.crackingPlatforms && q % 2 === 0;

    PLATFORMS.push({
      x: px,
      y: py,
      w: 160 + r() * 110,
      h: 22,
      kind: cracking ? 'crack' : (moving ? 'move' : 'stone'),
      ox: 0,
      phase: r() * 6.28,
      amp: moving ? 110 + r() * 90 : 0,
      broke: false
    });
  }

  // Mandatory Collectibles distribution (Reachable on platforms and exploration routes)
  for(let i=0; i<cfg.mandatoryCount; i++){
    const t = (i + 1) / (cfg.mandatoryCount + 1);
    const startX = cfg.landingPad.x + 320;
    const endX = cfg.departureRocket.x - 280;
    const px = lerp(startX, endX, t);
    const plat = PLATFORMS[3 + (i % (PLATFORMS.length - 3))];
    CELLS.push({
      x: plat ? plat.x + plat.w * 0.5 : px,
      y: plat ? plat.y - 42 : cfg.groundY - 70 - r() * 260,
      got: false,
      rot: r() * 6.28
    });
  }

  // Bonus Energy Orbs / Modules
  for(let j=0; j<cfg.bonusCount; j++){
    const t = (j + 1) / (cfg.bonusCount + 1);
    const startX = cfg.landingPad.x + 400;
    const endX = cfg.departureRocket.x - 400;
    const px = lerp(startX, endX, t) + (r() - 0.5) * 200;
    const plat = PLATFORMS[4 + ((j * 3) % (PLATFORMS.length - 3))];
    ORBS.push({
      x: plat ? plat.x + plat.w * 0.5 : px,
      y: plat ? plat.y - 80 : cfg.groundY - 180 - r() * 320,
      got: false,
      rot: 0
    });
  }

  // Hazards Configuration
  if(cfg.updrafts){
    for(let u=0; u<cfg.updrafts; u++){
      HAZARDS.push({
        type: u % 3 === 2 ? 'downdraft' : 'updraft',
        x: lerp(900, cfg.width - 900, u / cfg.updrafts),
        y: cfg.groundY - 450,
        w: 280, h: 900,
        fy: u % 3 === 2 ? 480 : -660
      });
    }
  }
  if(cfg.gravityZones){
    for(let g=0; g<cfg.gravityZones; g++){
      HAZARDS.push({
        type: g % 2 ? 'lowgrav' : 'heavygrav',
        x: lerp(850, cfg.width - 850, g / cfg.gravityZones),
        y: cfg.groundY - 320 - (r() * 320),
        r: 220
      });
    }
  }
  if(cfg.heatZones || cfg.acidZones){
    const count = cfg.heatZones || cfg.acidZones;
    for(let h=0; h<count; h++){
      HAZARDS.push({
        type: cfg.acidZones ? 'acid' : 'heat',
        x: lerp(1000, cfg.width - 900, h / count),
        y: cfg.groundY - 260 - (r() * 360),
        r: 230,
        drain: 3.5
      });
    }
  }
  if(cfg.lavaPits){
    for(let l=0; l<cfg.lavaPits; l++){
      HAZARDS.push({
        type: 'lava',
        x: lerp(900, cfg.width - 900, l / cfg.lavaPits),
        y: cfg.groundY + 16,
        w: 260 + r() * 140,
        h: 70
      });
    }
  }
  if(cfg.fireJets){
    for(let f=0; f<cfg.fireJets; f++){
      HAZARDS.push({
        type: 'firejet',
        x: lerp(1050, cfg.width - 950, f / cfg.fireJets),
        y: cfg.groundY,
        phase: r() * 6.28
      });
    }
  }
  if(cfg.iceGusts){
    for(let i=0; i<cfg.iceGusts; i++){
      HAZARDS.push({
        type: 'icegust',
        x: lerp(900, cfg.width - 900, i / cfg.iceGusts),
        y: cfg.groundY - 320 - (r() * 400),
        w: 440, h: 260,
        fx: -240
      });
    }
  }
  if(cfg.safeZones){
    for(let s=0; s<cfg.safeZones; s++){
      HAZARDS.push({
        type: 'safe',
        x: lerp(850, cfg.width - 850, s / cfg.safeZones),
        y: cfg.groundY - 20,
        r: 150
      });
    }
  }
  if(cfg.dustStorms){
    HAZARDS.push({
      type: 'storm',
      x: cfg.width * 0.5,
      y: cfg.groundY - 400,
      r: cfg.width * 0.45
    });
  }

  // Debris & Hot Rocks
  if(cfg.debris){
    for(let k=0; k<cfg.debris; k++){
      DEBRIS.push({
        x: clamp(800 + r() * (cfg.width - 1600), 400, cfg.width - 400),
        y: clamp(400 + r() * (cfg.groundY - 600), 200, cfg.groundY - 100),
        vx: (r() - 0.5) * 50,
        vy: (r() - 0.5) * 50,
        radius: 20 + r() * 16,
        rot: r() * 6.28,
        rotSpd: (r() - 0.5) * 1.5,
        hp: 2,
        hot: !!cfg.fallingRocks && (k % 2 === 0)
      });
    }
  }

  // Enemies Placement
  for(let e=0; e<(cfg.enemies || 0); e++){
    const plat = PLATFORMS[4 + ((e * 4) % Math.max(1, PLATFORMS.length - 4))];
    ENEMIES.push({
      type: cfg.enemyType || (cfg.id === 'aether_7' ? 'sentinel' : (cfg.id === 'vortex_prime' ? 'vortex' : 'voidling')),
      x: plat ? plat.x + plat.w * 0.5 : 1200 + e * 700,
      y: plat ? plat.y - 32 : cfg.groundY - 42,
      baseX: plat ? plat.x + plat.w * 0.5 : 1200 + e * 700,
      phase: r() * 6.28,
      hp: 2,
      facing: 1
    });
  }

  G.camX = PL.x - W/2;
  G.camY = PL.y - H/2;
  G.scene = 'play';
  G.toast = {
    a: cfg.name + ' · ' + cfg.type,
    b: 'ROCKET FLIGHT: Steer & touch down onto the Landing Beacon.',
    t: 4.5
  };
}

/* ──────── Draw Background & Sky Parallax ──────── */
const BG_STARS = Array.from({length: 120}, () => ({
  x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random()*1.8, sp: 0.5 + Math.random()*2, ph: Math.random()*6.28
}));

function drawBackground(cfg, camX, camY, t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, cfg.sky[0]);
  g.addColorStop(1, cfg.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Parallax starfield
  for(let i=0; i<BG_STARS.length; i++){
    const s = BG_STARS[i];
    const sx = mod(s.x - camX * 0.05, W);
    const sy = mod(s.y - camY * 0.05, H);
    const alpha = 0.4 + 0.6 * (0.5 + 0.5*Math.sin(t*s.sp + s.ph));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = cfg.starCol || '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Distant planetary glow
  const px = W * 0.7 - camX * 0.02, py = H * 0.3 - camY * 0.02;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(px, py, 40, px, py, 260);
  glow.addColorStop(0, cfg.accent + '22');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(px, py, 260, 0, 6.283);
  ctx.fill();
  ctx.restore();

  // Background artwork
  const bg = ASSET_IMAGES[cfg.bgArt];
  if(bg && bg.complete && bg.naturalWidth){
    ctx.save();
    ctx.globalAlpha = 0.36;
    ctx.drawImage(bg, -camX * 0.08, -camY * 0.04, W * 1.25, H * 1.25);
    ctx.restore();
  }

  // Planet artwork sphere in the sky
  const art = ASSET_IMAGES[cfg.planetArt];
  if(art && art.complete && art.naturalWidth){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.drawImage(art, W * 0.68 - camX * 0.025, H * 0.12 - camY * 0.02, 210, 210);
    ctx.restore();
  }
}

/* ──────── Draw Terrain & Platforms ──────── */
function terrainColor(cfg){
  if(cfg.id === 'cinder_moon') return '#2b0c05';
  if(cfg.id === 'cryos') return '#113559';
  if(cfg.id === 'vortex_prime') return '#162e15';
  if(cfg.id === 'aether_7') return '#0e3a40';
  if(cfg.id === 'earth') return '#163354';
  return '#1b143a';
}

function drawTerrain(cfg, camX, camY){
  const groundY = cfg.groundY - camY;
  ctx.save();

  // Surface bedrock gradient
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, terrainColor(cfg));
  grad.addColorStop(1, '#050713');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-40, H + 40);
  for(let x=-80; x<=W+120; x+=80){
    const wx = x + camX;
    const y = groundY + Math.sin(wx * 0.006) * 20 + Math.sin(wx * 0.016) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W+60, H+40);
  ctx.closePath();
  ctx.fill();

  // Top surface trim line in planet accent color
  ctx.strokeStyle = cfg.accent;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for(let x=-80; x<=W+120; x+=40){
    const wx = x + camX;
    const y = groundY + Math.sin(wx * 0.006) * 20 + Math.sin(wx * 0.016) * 8;
    if(x === -80) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Platforms
  for(const p of PLATFORMS){
    if(p.kind === 'ground' || p.broke) continue;
    const px = p.x + (p.ox || 0) - camX;
    const py = p.y - camY;
    if(px < -p.w || px > W + p.w || py < -80 || py > H + 80) continue;

    if(p.kind === 'landing_pad'){
      ctx.fillStyle = '#18244c';
      rr(px, py, p.w, p.h, 6);
      ctx.fill();
      ctx.strokeStyle = C.cyan;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      txt('▲ LANDING ZONE ▲', px + p.w * 0.5, py + 18, 12, C.cyan, 'center', F_U, 700, 2);
      continue;
    }

    if(p.kind === 'launch_pad'){
      ctx.fillStyle = '#2a1a44';
      rr(px, py, p.w, p.h, 6);
      ctx.fill();
      ctx.strokeStyle = C.gold;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      txt('★ EXTRACTION GANTRY ★', px + p.w * 0.5, py + 20, 12, C.gold, 'center', F_U, 700, 2);
      continue;
    }

    ctx.fillStyle = p.kind === 'crack' ? '#bdefff' : (p.kind === 'move' ? cfg.accent : terrainColor(cfg));
    ctx.globalAlpha = p.kind === 'crack' ? 0.82 : 0.9;
    rr(px, py, p.w, p.h, 6);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = cfg.accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    if(p.kind === 'crack'){
      ctx.strokeStyle = 'rgba(4,6,20,0.5)';
      ctx.beginPath();
      ctx.moveTo(px + p.w * 0.25, py + 3);
      ctx.lineTo(px + p.w * 0.42, py + p.h - 3);
      ctx.lineTo(px + p.w * 0.58, py + 5);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ──────── Draw Landing Rocket & Departure Rocket ──────── */
function drawRocketShip(p, camX, camY, t, scale = 1, isLanded = false){
  const sx = p.x - camX, sy = p.y - camY;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(scale, scale);
  ctx.rotate(p.angle);

  // Landing Struts if landed
  if(isLanded){
    ctx.strokeStyle = '#687898';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-16, 12); ctx.lineTo(-28, 28); ctx.lineTo(-34, 28);
    ctx.moveTo(16, 12); ctx.lineTo(28, 28); ctx.lineTo(34, 28);
    ctx.stroke();
  }

  // Delta Wings
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.moveTo(-8, 8); ctx.lineTo(-24, 25); ctx.lineTo(-8, 25); ctx.lineTo(6, 10); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-8, -8); ctx.lineTo(-24, -25); ctx.lineTo(-8, -25); ctx.lineTo(6, -10); ctx.closePath();
  ctx.fill();

  // Engine Nozzles
  ctx.fillStyle = '#2f3542';
  rr(-24, -7, 6, 14, 2);
  ctx.fill();
  ctx.fillStyle = p.thrusting ? '#ff7a2e' : '#ff4757';
  rr(-27, -5, 4, 10, 1);
  ctx.fill();

  // Aerodynamic Fuselage
  const hg = ctx.createLinearGradient(-20, -12, -20, 12);
  hg.addColorStop(0, '#8a99b8');
  hg.addColorStop(0.3, '#ffffff');
  hg.addColorStop(0.7, '#e8f0fe');
  hg.addColorStop(1, '#65738e');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(30, 0);
  ctx.quadraticCurveTo(8, -13, -20, -10);
  ctx.lineTo(-20, 10);
  ctx.quadraticCurveTo(8, 13, 30, 0);
  ctx.closePath();
  ctx.fill();

  // Red Racing Stripe
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.moveTo(4, -9); ctx.lineTo(10, -8); ctx.lineTo(8, 8); ctx.lineTo(2, 9); ctx.closePath();
  ctx.fill();

  // Cockpit Glass
  const cg = ctx.createLinearGradient(6, -4, 20, 4);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.35, C.cyan);
  cg.addColorStop(1, '#0b2447');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(10, 0, 9, 4.5, 0, 0, 6.283);
  ctx.fill();

  // Specular Glint
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(13, -1.5, 3.5, 1.2, -0.2, 0, 6.283);
  ctx.fill();

  // Phase Shield Bubble
  if(G.shieldT > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(61,240,255,0.18)';
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, 6.283);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawDepartureRocket(cfg, camX, camY, t){
  const rk = cfg.departureRocket;
  const rx = rk.x - camX, ry = rk.y - camY;
  if(rx < -200 || rx > W+200) return;

  ctx.save();
  ctx.translate(rx + rk.w * 0.5, ry + rk.h * 0.5);

  // Launch pad support gantry tower
  ctx.strokeStyle = '#445275';
  ctx.lineWidth = 3;
  ctx.strokeRect(-55, -rk.h * 0.5, 110, rk.h);
  for(let i=0; i<4; i++){
    ctx.beginPath();
    ctx.moveTo(-55, -rk.h * 0.5 + i*32);
    ctx.lineTo(55, -rk.h * 0.5 + (i+1)*32);
    ctx.stroke();
  }

  // Draw vertical rocket standing on pad
  ctx.save();
  ctx.rotate(-Math.PI / 2);
  drawRocketShip({x: 0, y: 0, angle: 0, thrusting: G.phase === 'takeoff'}, 0, 0, t, 1.55, true);
  ctx.restore();

  // Halo pulse indicating extraction point
  const allGot = G.cellsGot >= cfg.mandatoryCount;
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(0, 0, 10, 0, 0, 100);
  halo.addColorStop(0, allGot ? 'rgba(61,255,136,0.35)' : 'rgba(255,122,46,0.25)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, 100, 0, 6.283);
  ctx.fill();

  ctx.restore();
}

/* ──────── Draw Astronaut Hero (High-Tech 2D EVA Space Suit) ──────── */
function drawAstronautCharacter(p, camX, camY, t){
  const cfg = LVL;
  const sx = p.x - camX, sy = p.y - camY;

  // 1. Umbilical Life-Support Docking Tether to Lander (within 480px)
  if(cfg && cfg.landingPad){
    const landerX = cfg.landingPad.x, landerY = cfg.landingPad.y - 18;
    const distToPad = Math.hypot(p.x - landerX, p.y - landerY);
    if(distToPad < 480){
      const lx = landerX - camX, ly = landerY - camY;
      ctx.save();
      const tetherAlpha = clamp(1.0 - distToPad / 480, 0, 0.7);
      ctx.strokeStyle = `rgba(61,240,255,${tetherAlpha * 0.75})`;
      ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 4]);
      ctx.lineDashOffset = -t * 18;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      const midX = (lx + sx) * 0.5, midY = Math.max(ly, sy) + distToPad * 0.12;
      ctx.quadraticCurveTo(midX, midY, sx - p.face * 14, sy - 8);
      ctx.stroke();
      ctx.setLineDash([]);
      const prog = (t * 1.5) % 1.0;
      const nodeX = (1 - prog) * (1 - prog) * lx + 2 * (1 - prog) * prog * midX + prog * prog * (sx - p.face * 14);
      const nodeY = (1 - prog) * (1 - prog) * ly + 2 * (1 - prog) * prog * midY + prog * prog * (sy - 8);
      ctx.fillStyle = C.cyan;
      ctx.beginPath();
      ctx.arc(nodeX, nodeY, 2.5, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.save();
  const floatBob = p.onGround ? 0 : Math.sin(t * 3.4) * 2.8;
  const bodyTilt = p.onGround ? (p.vx * 0.0003) : clamp(p.vx * 0.0012, -0.42, 0.42);

  ctx.translate(sx, sy + floatBob);
  ctx.scale(p.face, 1);
  ctx.rotate(bodyTilt * p.face);

  const fem = G.char === 'mira';
  const suitWhite = fem ? '#f5eefc' : '#ebf3ff';
  const suitShade = fem ? '#b8a6d4' : '#9bb5db';
  const jointDark = fem ? '#24143a' : '#101d3b';
  const accColor  = fem ? '#ff5ec4' : C.cyan;
  const accDark   = fem ? '#b82088' : '#0b7da8';

  // 2. Volumetric Helmet Headlight Beam
  ctx.save();
  const beamGrad = ctx.createRadialGradient(16, -14, 4, 140, -10, 160);
  beamGrad.addColorStop(0, 'rgba(61,240,255,0.22)');
  beamGrad.addColorStop(0.3, 'rgba(61,240,255,0.08)');
  beamGrad.addColorStop(1, 'rgba(61,240,255,0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(14, -14);
  ctx.lineTo(190, -65);
  ctx.lineTo(210, 35);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 3. MMU / SAFER Propulsion Backpack
  ctx.fillStyle = jointDark;
  rr(-22, -18, 14, 32, 4);
  ctx.fill();
  ctx.strokeStyle = '#34476c';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Twin Nitrogen / RCS Propellant Tanks
  const tankGrad = ctx.createLinearGradient(-21, -16, -9, -16);
  tankGrad.addColorStop(0, '#5a6e94');
  tankGrad.addColorStop(0.5, '#b0c6ea');
  tankGrad.addColorStop(1, '#334466');
  ctx.fillStyle = tankGrad;
  rr(-20, -16, 5, 26, 2.5); ctx.fill();
  rr(-14, -16, 5, 26, 2.5); ctx.fill();

  // Safety Yellow Ring bands
  ctx.fillStyle = C.gold;
  rr(-20, -10, 5, 2.5, 0.5); ctx.fill();
  rr(-14, -10, 5, 2.5, 0.5); ctx.fill();
  rr(-20, -1, 5, 2.5, 0.5); ctx.fill();
  rr(-14, -1, 5, 2.5, 0.5); ctx.fill();

  // Antenna on backpack
  ctx.strokeStyle = '#8fa3c7';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-16, -18); ctx.lineTo(-21, -30);
  ctx.stroke();
  ctx.fillStyle = Math.sin(t * 8) > 0 ? C.cyan : '#122544';
  ctx.beginPath();
  ctx.arc(-21, -30, 2.5, 0, 6.283);
  ctx.fill();

  // Dynamic RCS Thruster Plumes
  // A. Bottom Main Thruster (fires downward when lifting/hovering)
  const isUpThrust = (p.thrustingUp || held.up || held.thrust || (G.fuel > 0 && !p.onGround && p.vy < -40));
  if(isUpThrust && G.fuel > 0){
    const pLen = 22 + Math.random() * 14;
    const pGrad = ctx.createLinearGradient(-15, 14, -15, 14 + pLen);
    pGrad.addColorStop(0, '#ffffff');
    pGrad.addColorStop(0.2, C.cyan);
    pGrad.addColorStop(0.7, '#1b5fff');
    pGrad.addColorStop(1, 'rgba(27,95,255,0)');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.moveTo(-20, 14); ctx.lineTo(-9, 14); ctx.lineTo(-14.5, 14 + pLen);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-18, 14); ctx.lineTo(-11, 14); ctx.lineTo(-14.5, 14 + pLen * 0.45);
    ctx.closePath();
    ctx.fill();
  }

  // B. Top Reverse RCS Nozzles (fires upward when descending/braking)
  const isDownThrust = (held.down && !p.onGround);
  if(isDownThrust && G.fuel > 0){
    ctx.fillStyle = 'rgba(61,240,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(-19, -18); ctx.lineTo(-11, -18); ctx.lineTo(-15, -30 - Math.random() * 8);
    ctx.closePath();
    ctx.fill();
  }

  // C. Lateral RCS Thruster Nozzles
  if(Math.abs(p.vx) > 80 && !p.onGround && G.fuel > 0){
    ctx.fillStyle = 'rgba(61,240,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(-22, -4); ctx.lineTo(-22, 4); ctx.lineTo(-32 - Math.random() * 6, 0);
    ctx.closePath();
    ctx.fill();
  }

  // D. Tactical Boost Flare
  if(p.boostT > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bGrad = ctx.createRadialGradient(-16, 0, 2, -16, 0, 48);
    bGrad.addColorStop(0, '#ffffff');
    bGrad.addColorStop(0.3, accColor);
    bGrad.addColorStop(0.7, '#ff7a2e');
    bGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(-16, 0, 48, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  // 4. Back Leg & Boot
  const walk = p.walkCycle || 0;
  const legSwing = p.onGround ? Math.sin(walk) * 8 : (Math.sin(t * 2.5) * 3 + 4);
  const backLegX = -4 - legSwing * 0.6;
  const backLegY = 12 + Math.abs(legSwing) * 0.3;

  ctx.fillStyle = suitShade;
  rr(backLegX - 4, backLegY, 8, 14, 4); ctx.fill();
  ctx.fillStyle = jointDark;
  rr(backLegX - 3, backLegY + 8, 6, 3, 1); ctx.fill();
  ctx.fillStyle = '#223254';
  rr(backLegX - 5, backLegY + 12, 11, 7, 2.5); ctx.fill();
  ctx.fillStyle = accDark;
  rr(backLegX - 5, backLegY + 17, 11, 2, 0.5); ctx.fill();

  // 5. Torso
  const torsoGrad = ctx.createLinearGradient(-10, -14, 12, 14);
  torsoGrad.addColorStop(0, suitWhite);
  torsoGrad.addColorStop(0.65, suitWhite);
  torsoGrad.addColorStop(1, suitShade);
  ctx.fillStyle = torsoGrad;
  rr(-9, -15, 21, 27, 6);
  ctx.fill();
  ctx.strokeStyle = '#8fa3cc';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Mission Accent Stripes
  ctx.fillStyle = accColor;
  rr(-3, -15, 4, 27, 2); ctx.fill();
  rr(4, -15, 2, 27, 1); ctx.fill();

  // 6. Chest Display & Control Module (DCM)
  ctx.fillStyle = jointDark;
  rr(-2, -8, 14, 16, 3);
  ctx.fill();
  ctx.strokeStyle = '#3e527a';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ECG Heartbeat / Oxygen Monitor Screen
  ctx.fillStyle = '#05111d';
  rr(0, -6, 10, 7, 1.5);
  ctx.fill();
  ctx.strokeStyle = G.oxygen > 25 ? '#3dff88' : C.red;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(1, -2.5);
  ctx.lineTo(3, -2.5);
  ctx.lineTo(4.5, -5);
  ctx.lineTo(6, -0.5);
  ctx.lineTo(7.5, -2.5);
  ctx.lineTo(9, -2.5);
  ctx.stroke();

  // DCM Status LEDs
  ctx.fillStyle = C.green;
  ctx.beginPath(); ctx.arc(1, 4, 1.2, 0, 6.283); ctx.fill();
  ctx.fillStyle = accColor;
  ctx.beginPath(); ctx.arc(5, 4, 1.2, 0, 6.283); ctx.fill();
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(9, 4, 1.2, 0, 6.283); ctx.fill();

  // Umbilical Hoses to Helmet
  ctx.strokeStyle = '#62769c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(8, -8); ctx.quadraticCurveTo(12, -12, 10, -16);
  ctx.stroke();

  // 7. Front Leg & Boot
  const frontLegSwing = p.onGround ? -Math.sin(walk) * 8 : (-Math.sin(t * 2.5) * 3 - 3);
  const frontLegX = 4 + frontLegSwing * 0.6;
  const frontLegY = 12 + Math.abs(frontLegSwing) * 0.3;

  ctx.fillStyle = suitWhite;
  rr(frontLegX - 4, frontLegY, 8, 14, 4); ctx.fill();
  ctx.strokeStyle = '#8fa3cc'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = jointDark;
  rr(frontLegX - 3, frontLegY + 8, 6, 3, 1); ctx.fill();
  ctx.fillStyle = '#1c2844';
  rr(frontLegX - 5, frontLegY + 12, 12, 7, 2.5); ctx.fill();
  ctx.fillStyle = accColor;
  rr(frontLegX - 5, frontLegY + 17, 12, 2.5, 0.8); ctx.fill();
  if(p.onGround){
    ctx.fillStyle = 'rgba(61,240,255,0.4)';
    rr(frontLegX - 7, frontLegY + 19, 16, 2, 1); ctx.fill();
  }

  // 8. Helmet & Gold Specular Visor
  ctx.fillStyle = jointDark;
  rr(2, -18, 15, 4, 1.5); ctx.fill();

  const helmGrad = ctx.createRadialGradient(9, -24, 3, 10, -22, 13);
  helmGrad.addColorStop(0, '#ffffff');
  helmGrad.addColorStop(0.7, suitWhite);
  helmGrad.addColorStop(1, suitShade);
  ctx.fillStyle = helmGrad;
  ctx.beginPath();
  ctx.arc(10, -22, 11.5, 0, 6.283);
  ctx.fill();
  ctx.strokeStyle = '#8ea4cb';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  const visorGrad = ctx.createLinearGradient(7, -30, 19, -15);
  visorGrad.addColorStop(0, '#fff4a3');
  visorGrad.addColorStop(0.25, '#ffc02e');
  visorGrad.addColorStop(0.65, '#0a4275');
  visorGrad.addColorStop(1, '#03142e');
  ctx.fillStyle = visorGrad;
  ctx.beginPath();
  ctx.ellipse(13.5, -22, 7.5, 8.5, 0.1, 0, 6.283);
  ctx.fill();
  ctx.strokeStyle = '#ffe485';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Visor Specular Reflection Crescent
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(12.5, -23, 6, -1.8, -0.4);
  ctx.stroke();

  // Interior HUD Reticle Glow
  ctx.fillStyle = 'rgba(61,240,255,0.6)';
  ctx.beginPath();
  ctx.arc(15, -22, 1.5, 0, 6.283);
  ctx.fill();

  // Headlight Bezel
  ctx.fillStyle = '#ff7a2e';
  rr(16, -16, 3, 3, 1); ctx.fill();

  // 9. Arm & EVA Glove
  const armAngle = p.atkT > 0 ? 0 : (p.onGround ? Math.sin(walk) * 0.4 : -0.2);
  ctx.save();
  ctx.translate(2, -8);
  ctx.rotate(armAngle);
  ctx.fillStyle = suitWhite;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.283); ctx.fill();
  ctx.fillStyle = accColor;
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.283); ctx.fill();
  rr(-2, 0, 5, 12, 2.5); ctx.fill();
  ctx.fillStyle = jointDark;
  rr(-3, 9, 7, 6, 2); ctx.fill();
  ctx.restore();

  // 10. Energy Sword Attack
  if(p.atkT > 0){
    const swingProg = 1 - p.atkT / 0.22;
    const a = lerp(-1.8, 1.4, swingProg);
    ctx.save();
    ctx.translate(6, -2);
    ctx.rotate(a);

    ctx.fillStyle = jointDark;
    rr(0, -3, 10, 6, 2); ctx.fill();
    ctx.fillStyle = accColor;
    rr(8, -5, 3, 10, 1.5); ctx.fill();

    ctx.strokeStyle = accColor;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(44, 0);
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(42, 0);
    ctx.stroke();

    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${fem ? '255,94,196' : '61,240,255'},0.65)`;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.arc(0, 0, 42, -0.7, 0.5);
    ctx.stroke();
    ctx.restore();
  }

  // 11. Phase Shield Hex Bubble
  if(G.shieldT > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 36);
    sGrad.addColorStop(0, 'rgba(61,240,255,0.08)');
    sGrad.addColorStop(0.75, 'rgba(61,240,255,0.28)');
    sGrad.addColorStop(1, 'rgba(180,104,248,0.7)');
    ctx.fillStyle = sGrad;
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for(let a=0; a<6; a++){
      const ang = (a * 60 + t * 45) * Math.PI / 180;
      const hx = Math.cos(ang) * 36, hy = Math.sin(ang) * 36;
      if(a === 0) ctx.moveTo(hx, hy);
      else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

/* ──────── Draw Planet-Specific Collectibles ──────── */
function drawMandatoryCollectible(c, cfg, camX, camY, t){
  const cx = c.x - camX, cy = c.y - camY + Math.sin(t*3 + c.x)*5;
  if(cx < -40 || cx > W+40 || cy < -40 || cy > H+40) return;

  ctx.save();
  ctx.translate(cx, cy);

  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
  gl.addColorStop(0, cfg.accent);
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(-26, -26, 52, 52);

  if(cfg.id === 'fractured_moon'){
    ctx.rotate(t * 1.8);
    ctx.fillStyle = C.purple;
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(13, 0); ctx.lineTo(0, 14); ctx.lineTo(-13, 0); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.283); ctx.fill();
  } else if(cfg.id === 'aether_7'){
    ctx.rotate(Math.sin(t*2)*0.2);
    ctx.fillStyle = C.teal;
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(10, -6); ctx.lineTo(6, 14); ctx.lineTo(-6, 14); ctx.lineTo(-10, -6); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if(cfg.id === 'cinder_moon'){
    ctx.rotate(t * 2.2);
    const mg = ctx.createRadialGradient(0, 0, 2, 0, 0, 13);
    mg.addColorStop(0, '#ffffff'); mg.addColorStop(0.4, '#ff9a2e'); mg.addColorStop(1, '#ff2200');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 2; ctx.stroke();
  } else if(cfg.id === 'cryos'){
    ctx.fillStyle = C.ice;
    rr(-6, -13, 12, 26, 3); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-3, -7, 6, 14);
  } else if(cfg.id === 'vortex_prime'){
    ctx.fillStyle = C.toxic;
    rr(-7, -12, 14, 24, 4); ctx.fill();
    ctx.strokeStyle = '#eaffc7'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#061608';
    rr(-3, -8, 6, 16, 2); ctx.fill();
  } else {
    ctx.rotate(t * 1.5);
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.lineTo(12, 0); ctx.lineTo(0, 15); ctx.lineTo(-12, 0); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.restore();
}

function drawEnergyOrb(o, camX, camY, t){
  const ox = o.x - camX, oy = o.y - camY + Math.sin(t*2.5 + o.x)*6;
  if(ox < -50 || ox > W+50 || oy < -50 || oy > H+50) return;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 6, 0, 0, 30);
  gl.addColorStop(0, 'rgba(255,209,102,0.7)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(-30, -30, 60, 60);

  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill();

  ctx.rotate(t * 2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 7, 0, 0, 6.283); ctx.stroke();
  ctx.restore();
}

/* ──────── Draw Hazards ──────── */
function drawHazards(haz, cfg, camX, camY, t){
  for(const h of haz){
    const hx = h.x - camX, hy = h.y - camY;
    if(h.type === 'updraft' || h.type === 'downdraft' || h.type === 'icegust'){
      if(hx < -h.w || hx > W+h.w || hy < -h.h || hy > H+h.h) continue;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const col = h.type === 'downdraft' ? 'rgba(120,120,255,0.1)' : (h.type === 'icegust' ? 'rgba(120,230,255,0.12)' : 'rgba(120,255,210,0.14)');
      ctx.fillStyle = col;
      rr(hx - h.w/2, hy - h.h/2, h.w, h.h, 12);
      ctx.fill();
      for(let i=0; i<6; i++){
        const yy = hy - h.h/2 + ((t*100 + i*110) % h.h);
        ctx.strokeStyle = h.type === 'downdraft' ? '#8f8cff' : C.cyan;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(hx - h.w/2 + 30 + i*40, yy);
        ctx.lineTo(hx - h.w/2 + 30 + i*40, yy + (h.type === 'downdraft' ? 55 : -55));
        ctx.stroke();
      }
      ctx.restore();
    } else if(h.type === 'lowgrav' || h.type === 'heavygrav'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const col = h.type === 'lowgrav' ? 'rgba(186,104,248,0.25)' : 'rgba(255,122,46,0.22)';
      const gl = ctx.createRadialGradient(hx, hy, 20, hx, hy, h.r);
      gl.addColorStop(0, col);
      gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(hx, hy, h.r, 0, 6.283); ctx.fill();
      txt(h.type === 'lowgrav' ? 'LOW-G FIELD' : 'HEAVY-G FIELD', hx, hy - h.r + 20, 11, cfg.accent, 'center', F_U, 700);
      ctx.restore();
    } else if(h.type === 'lava'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,70,15,0.85)';
      rr(hx - h.w/2, hy - h.h/2, h.w, h.h, 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,210,60,0.45)';
      for(let i=0;i<7;i++){
        ctx.beginPath();
        ctx.arc(hx - h.w/2 + i*h.w/6, hy - 12 + Math.sin(t*5+i)*7, 8, 0, 6.283);
        ctx.fill();
      }
      ctx.restore();
    } else if(h.type === 'firejet'){
      const active = Math.sin(t * 2.8 + h.phase) > -0.2;
      if(!active) continue;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const height = 150 + Math.sin(t*12+h.phase)*24;
      const fg = ctx.createLinearGradient(hx, hy, hx, hy - height);
      fg.addColorStop(0, 'rgba(255,230,80,0.85)');
      fg.addColorStop(0.45, 'rgba(255,90,20,0.7)');
      fg.addColorStop(1, 'rgba(255,20,60,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(hx - 22, hy); ctx.quadraticCurveTo(hx, hy - height - 20, hx + 22, hy); ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if(h.type === 'safe'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gl = ctx.createRadialGradient(hx, hy, 10, hx, hy, h.r);
      gl.addColorStop(0, 'rgba(61,255,136,0.24)');
      gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(hx, hy, h.r, 0, 6.283); ctx.fill();
      txt('OXYGEN SAFE DOME', hx, hy - h.r + 20, 11, C.green, 'center', F_U, 700);
      ctx.restore();
    } else if(h.type === 'heat' || h.type === 'acid'){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const col = h.type === 'heat' ? 'rgba(255,100,30,' : 'rgba(180,240,40,';
      const gl = ctx.createRadialGradient(hx, hy, 10, hx, hy, h.r);
      gl.addColorStop(0, col + '0.4)');
      gl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(hx, hy, h.r, 0, 6.283); ctx.fill();
      txt(h.type === 'heat' ? '⚠️ THERMAL ZONE' : '⚠️ TOXIC CLOUD', hx, hy - h.r + 20, 11, col + '0.9)', 'center', F_U, 700);
      ctx.restore();
    } else if(h.type === 'storm'){
      ctx.save();
      ctx.globalAlpha = 0.12 + Math.sin(t * 1.5) * 0.05;
      ctx.fillStyle = '#ffaa66';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }
}

/* ──────── Draw Black Hole Singularity (Fractured Moon) ──────── */
function drawBlackHole(pos, killR, camX, camY, t){
  const hx = pos.x - camX, hy = pos.y - camY;
  ctx.save();
  ctx.translate(hx, hy);

  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, killR * 0.8, 0, 0, 520);
  gl.addColorStop(0, 'rgba(255,140,40,0.85)');
  gl.addColorStop(0.2, 'rgba(255,70,160,0.5)');
  gl.addColorStop(0.5, 'rgba(130,40,255,0.22)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, 520, 0, 6.283); ctx.fill();

  ctx.save();
  ctx.rotate(-t * 0.65);
  const ringColors = ['#ff8833','#ff3388','#b044ff','#ffd700','#3df0ff'];
  for(let i=0; i<5; i++){
    ctx.strokeStyle = ringColors[i];
    ctx.lineWidth = 14 - i * 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 150 + i*40, 48 + i*13, 0, 0, 6.283); ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,235,190,0.75)';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, 0, killR + 12, 0, 6.283); ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#010105';
  ctx.beginPath(); ctx.arc(0, 0, killR, 0, 6.283); ctx.fill();
  ctx.restore();
}

/* ──────── Draw Enemies & Combat Bullets ──────── */
function drawEnemies(camX, camY, t){
  for(const e of ENEMIES){
    const ex = e.x - camX, ey = e.y - camY;
    if(ex < -80 || ex > W+80 || ey < -80 || ey > H+80) continue;
    const src = e.type === 'sentinel' ? 'assets/enemies/guardian_aether_sentinel.svg' : (e.type === 'vortex' ? 'assets/enemies/guardian_vortex.svg' : 'assets/enemies/voidling.svg');
    const img = ASSET_IMAGES[src];
    ctx.save();
    ctx.translate(ex, ey + Math.sin(t*2.5 + e.phase) * 6);
    if(img && img.complete && img.naturalWidth){
      ctx.drawImage(img, -28, -28, 56, 56);
    } else {
      ctx.fillStyle = e.type === 'vortex' ? C.toxic : (e.type === 'sentinel' ? C.teal : C.purple);
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBullets(camX, camY){
  ctx.save();
  for(const b of BULLETS){
    const bx = b.x - camX, by = b.y - camY;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, 6.283); ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx - b.vx * 0.04, by - b.vy * 0.04); ctx.lineTo(bx, by); ctx.stroke();
  }
  ctx.restore();
}

function drawDebris(d, camX, camY){
  const dx = d.x - camX, dy = d.y - camY;
  if(dx < -60 || dx > W+60 || dy < -60 || dy > H+60) return;
  ctx.save();
  ctx.translate(dx, dy);
  ctx.rotate(d.rot);
  ctx.fillStyle = d.hot ? '#421408' : '#555046';
  ctx.strokeStyle = d.hot ? C.ember : '#9c9282';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -d.radius);
  ctx.lineTo(d.radius*0.8, -d.radius*0.6);
  ctx.lineTo(d.radius, d.radius*0.3);
  ctx.lineTo(d.radius*0.4, d.radius*0.9);
  ctx.lineTo(-d.radius*0.5, d.radius*0.8);
  ctx.lineTo(-d.radius*0.9, -d.radius*0.2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

  const px = 245, py = 24;

  txt(objText, W/2, 40, 12, objColor, 'center', F_U, 700, 1);

  // Check Life Support Docking Tether
  const distLander = Math.hypot(PL.x - cfg.landingPad.x, PL.y - cfg.landingPad.y);
  if(distLander < 140 && G.phase === 'explore'){
    txt('⚡ LIFE-SUPPORT TETHER DOCKED [RECHARGING]', W/2, 58, 11, C.green, 'center', F_U, 700);
  } else {
    // Environmental Hazard Indicator
    let envText = '';

      envText = 'GRAVITY DISTORTION: ANOMALIES ACTIVE';

    } else if(cfg.id === 'aether_7'){
      envText = 'VERTICAL UPDRAFT CHANNELS DETECTED';
      envColor = C.teal;
    } else if(cfg.id === 'cinder_moon'){
      envText = 'VOLCANIC HEAT & LAVA HAZARD ACTIVE';
      envColor = C.ember;
    } else if(cfg.id === 'cryos'){
      envText = 'GLACIAL TRACTION: SUB-ZERO SLIPPERY ICE';
      envColor = C.ice;
    } else if(cfg.id === 'vortex_prime'){
      const suitPct = Math.floor(PL.suit);
      envText = 'SUIT PROTECTION: ' + suitPct + '% (SEEK SAFE DOMES)';
      envColor = suitPct > 35 ? C.toxic : C.red;
    } else if(cfg.id === 'earth'){
      envText = 'ATMOSPHERIC WIND: ➔ 165 KM/H GUST FORCE';
      envColor = C.cyan;
    }
    txt(envText, W/2, 58, 11, envColor, 'center', F_U, 700);
  }

  // Top Right: Distance & Radar to Departure Rocket
  const targetX = G.phase === 'flight' ? cfg.landingPad.x : cfg.departureRocket.x;
  const targetY = G.phase === 'flight' ? cfg.landingPad.y : cfg.departureRocket.y;
  const dx = targetX - PL.x, dy = targetY - PL.y;
  const dist = Math.hypot(dx, dy);
  const arrow = getArrow(Math.atan2(dy, dx));

  let radarText = '';
  if(G.phase === 'flight'){
    radarText = 'LANDING BEACON: ' + Math.floor(dist) + 'm ' + arrow;
  } else if(!allSecured){
    radarText = 'DEPARTURE ROCKET: ' + Math.floor(dist) + 'm ' + arrow + ' [LOCKED]';
  } else {
    radarText = 'DEPARTURE ROCKET: ' + Math.floor(dist) + 'm ' + arrow + ' [READY TO BOARD]';

  // Bottom Toast Notifications
  if(G.toast && G.toast.t > 0){
    const a = clamp(Math.min(G.toast.t, 1), 0, 1);

    rr(W/2 - 260, H - 76, 520, 50, 8);
    ctx.fillStyle = 'rgba(7,10,26,0.92)';

    ctx.lineWidth = 1.5;
    ctx.stroke();

    txt(G.toast.b, W/2, H - 36, 11, C.bone, 'center', F_U, 600, 1);
    ctx.restore();
  }
}

function getArrow(angle){
  let deg = angle * 180 / Math.PI;
  if(deg < 0) deg += 360;
  if(deg >= 337.5 || deg < 22.5) return '➔';
  if(deg >= 22.5 && deg < 67.5) return '➘';
  if(deg >= 67.5 && deg < 112.5) return '⬇';
  if(deg >= 112.5 && deg < 157.5) return '↙';
  if(deg >= 157.5 && deg < 202.5) return '⬅';
  if(deg >= 202.5 && deg < 247.5) return '↖';
  if(deg >= 247.5 && deg < 292.5) return '⬆';
  return '➚';
}

/* ═════════════════════════════════════════════════════════════════
   CONTINUOUS GAMEPLAY LOOP SIMULATION STEP
   ROCKET FLIGHT -> LANDING -> EXIT -> EXPLORATION -> BOARDING ->
   TAKEOFF -> WARP TO NEXT PLANET
   ═════════════════════════════════════════════════════════════════ */
function updatePlay(dt){
  const p = PL, cfg = LVL;
  G.shake = Math.max(0, G.shake - dt * 25);
  if(G.toast && G.toast.t > 0) G.toast.t -= dt;
  p.boostCd -= dt;
  p.inv -= dt;
  p.atkT -= dt;
  p.atkCd -= dt;
  p.shootCd -= dt;
  G.shieldCd -= dt;
  if(G.shieldT > 0) G.shieldT -= dt;

  // Steering & Input
  let steerDir = 0;
  if(held.left) steerDir -= 1;
  if(held.right) steerDir += 1;

  const wantThrust = held.up || held.thrust || pressed('thrust');
  const hasFuel = G.fuel > 0;

  // 1. PHASE: ROCKET FLIGHT (Descent into landing beacon)
  if(G.phase === 'flight'){
    p.angle += steerDir * 3.8 * dt;
    p.face = Math.cos(p.angle) >= 0 ? 1 : -1;

    p.thrusting = wantThrust;
    setThrusterRumble(wantThrust && hasFuel);

    if(wantThrust){
      const power = 740 * getThrustMult();
      const cosA = Math.cos(p.angle), sinA = Math.sin(p.angle);
      p.vx += cosA * power * dt;
      p.vy += sinA * power * dt;
      G.fuel = Math.max(0, G.fuel - 2.8 * getBurnMult() * dt);
      for(let i=0; i<3; i++){
        spawn(p.x - cosA * 20, p.y - sinA * 20, -cosA * 240 + (Math.random()-0.5)*50, -sinA * 240 + (Math.random()-0.5)*50, 0.28, 4.5, Math.random()<0.5?C.cyan:'#ff9a2e', 0, true);
      }
    }

    if(held.down){ // Reverse brake
      p.vx *= (1.0 - 2.8 * dt);
      p.vy *= (1.0 - 2.8 * dt);
    }

    // Gentle planetary atmospheric gravity
    p.vy += cfg.gravity * 0.45 * dt;
    p.vx *= cfg.airDrag || 0.985;
    p.vy *= cfg.airDrag || 0.985;

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Check Landing Touchdown
    const pad = cfg.landingPad;
    const distPad = Math.hypot(p.x - pad.x, p.y - pad.y);
    if(distPad < 85 && p.y <= pad.y + 15){
      G.phase = 'landing';
      G.phaseTimer = 0;
      p.vx = 0; p.vy = 0;
      p.x = pad.x; p.y = pad.y - 10;
      p.angle = 0;
      setThrusterRumble(false);
      SFX.land();
      burst(pad.x, pad.y, 24, C.cyan, 220, 0.7, true);
      G.toast = {
        a: 'TOUCHDOWN CONFIRMED',
        b: 'Landing gear locked. Astronaut deploying onto ' + cfg.name,
        t: 3.5
      };
    }
  }

  // 2. PHASE: LANDING SEQUENCE
  else if(G.phase === 'landing'){
    G.phaseTimer += dt;
    p.x = lerp(p.x, cfg.landingPad.x, dt * 6);
    p.y = lerp(p.y, cfg.landingPad.y - 12, dt * 6);
    p.angle = lerp(p.angle, 0, dt * 10);
    if(G.phaseTimer >= 1.2){
      G.phase = 'exit';
      G.phaseTimer = 0;
      SFX.door();
      p.x = cfg.landingPad.x + 35;
      p.y = cfg.landingPad.y - 28;
      p.vx = 80; p.vy = -180;
      G.toast = {
        a: 'ASTRONAUT DEPLOYED',
        b: 'Collect ' + cfg.mandatoryCount + ' ' + cfg.mandatoryName + ' across the terrain.',
        t: 4.0
      };
    }
  }

  // 3. PHASE: EXIT HATCH
  else if(G.phase === 'exit'){
    G.phaseTimer += dt;
    p.vy += cfg.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if(p.y >= cfg.landingPad.y - 18){
      p.y = cfg.landingPad.y - 18;
      p.vy = 0;
      G.phase = 'explore';
    }
  }

  // 4. PHASE: PLANET EXPLORATION & OBJECTIVES (Realistic 2D Space Flight & Surface EVA)
  else if(G.phase === 'explore'){
    p.coyote = p.onGround ? 0.12 : Math.max(0, p.coyote - dt);
    p.thrustingUp = false;
    p.thrustingDown = false;
    p.thrustingHoriz = 0;

    // A. Life Support System (Oxygen & Tether Docking)
    G.oxygen = G.oxygen !== undefined ? G.oxygen : 100;
    const o2Drain = (cfg.oxygenDrain || 0.45) * dt;
    G.oxygen = Math.max(0, G.oxygen - o2Drain);

    // Tether Docking with Lander (automatic oxygen & propellant replenishment within 140px)
    const distLander = Math.hypot(p.x - cfg.landingPad.x, p.y - (cfg.landingPad.y - 18));
    if(distLander < 140){
      G.oxygen = Math.min(100, G.oxygen + 35 * dt);
      G.fuel = Math.min(getMaxFuel(), G.fuel + 28 * dt);
      if(Math.random() < 0.08) spawn(cfg.landingPad.x + (Math.random()-0.5)*30, cfg.landingPad.y - 20, 0, -30, 0.3, 2, C.cyan, 0, true);
    }

    // Critical Oxygen Asphyxiation Warning
    if(G.oxygen <= 0){
      p.o2DmgT = (p.o2DmgT || 0) + dt;
      if(p.o2DmgT > 2.0){
        p.o2DmgT = 0;
        G.hp -= 1;
        SFX.hit();
        G.shake = 8;
        G.toast = { a: 'CRITICAL LIFE SUPPORT', b: 'SUIT OXYGEN DEPLETED IN VACUUM!', t: 2.2 };
        if(G.hp <= 0) { die('SUIT OXYGEN DEPLETED IN THE VACUUM'); return; }
      }
    }

    // B. Ground Walking vs Space Flight Kinematics
    if(p.onGround){
      // Surface locomotion
      p.walkCycle = (p.walkCycle || 0) + Math.abs(p.vx) * dt * 0.022;
      const friction = cfg.friction || 0.82;
      const accel = cfg.id === 'cryos' ? 750 : 2100;

      if(steerDir !== 0){
        p.vx += steerDir * accel * dt;
        p.face = steerDir;
      } else {
        p.vx *= Math.pow(friction, dt * 18);
      }
      p.vx = clamp(p.vx, -450, 450);

      // Surface Jump / Liftoff into Space Flight
      if((pressed('up') || pressed('thrust')) && (p.onGround || p.coyote > 0)){
        p.vy = -540;
        p.onGround = false;
        p.coyote = 0;
        SFX.boost();
        burst(p.x, p.y + 16, 12, '#ffffff', 120, 0.35);
      }
    } else {
      // Free Space Flight / Microgravity EVA with MMU Thruster Pack
      p.walkCycle = (p.walkCycle || 0) + dt * 2.0;

      // 1. Upward Thrusters (Counteract gravity / Fly upward)
      if(wantThrust && hasFuel){
        p.thrustingUp = true;
        const upPower = 940 * getThrustMult();
        p.vy -= upPower * dt;
        G.fuel = Math.max(0, G.fuel - 1.8 * getBurnMult() * dt);
        if(Math.random() < 0.7){
          SFX.rcs();
          spawn(p.x - p.face*14, p.y + 14, -p.face*30 + (Math.random()-0.5)*40, 160 + Math.random()*70, 0.25, 4, C.cyan, 0, true);
        }
      }

      // 2. Downward Reverse RCS (Altitude descent control)
      if(held.down && hasFuel){
        p.thrustingDown = true;
        p.vy += 650 * getThrustMult() * dt;
        G.fuel = Math.max(0, G.fuel - 1.2 * getBurnMult() * dt);
        if(Math.random() < 0.6){
          SFX.rcs();
          spawn(p.x - p.face*14, p.y - 18, -p.face*20 + (Math.random()-0.5)*30, -140 - Math.random()*60, 0.2, 3, C.cyan, 0, true);
        }
      }

      // 3. Lateral RCS Thrusters (Horizontal space maneuvering)
      if(steerDir !== 0 && hasFuel){
        p.thrustingHoriz = steerDir;
        p.vx += steerDir * 840 * dt;
        p.face = steerDir;
        G.fuel = Math.max(0, G.fuel - 0.7 * getBurnMult() * dt);
      } else {
        // Space Momentum Conservation (Newton's 1st Law)
        if(held.down){ // Active Retrograde Braking / SAS
          p.vx *= (1.0 - 4.2 * dt);
        } else {
          // Low drag vacuum drift
          p.vx *= Math.pow(cfg.airDrag || 0.994, dt * 60);
        }
      }

      p.vx = clamp(p.vx, -620, 620);
      p.vy = clamp(p.vy, -660, 660);
    }

    // Tactical Dash / Emergency MMU Burn (Shift)
    if(pressed('boost') && p.boostCd <= 0 && G.fuel >= 6){
      p.boostCd = 1.2;
      p.boostT = 0.28;
      G.fuel -= 6;
      p.inv = Math.max(p.inv, 0.4);
      p.vx = p.face * 820;
      SFX.boost();
      G.shake = 6;
      burst(p.x, p.y, 18, C.cyan, 200, 0.5, true);
    }

    // Energy Sword Melee Attack (J / X / Left Click)
    if(pressed('atk') && p.atkCd <= 0){
      p.atkT = 0.22;
      p.atkCd = 0.35;
      SFX.sword();
      // Hit detection on enemies within swing range
      const slashX = p.x + p.face * 35;
      for(let e=ENEMIES.length-1; e>=0; e--){
        const enemy = ENEMIES[e];
        if(Math.hypot(slashX - enemy.x, p.y - enemy.y) < 75){
          enemy.hp -= 1;
          SFX.hit();
          G.shake = 5;
          burst(enemy.x, enemy.y, 14, cfg.accent, 190, 0.4, true);
          if(enemy.hp <= 0){
            ENEMIES.splice(e, 1);
            G.score += 50;
            G.credits += 25;
            SFX.fuel();
            burst(enemy.x, enemy.y, 25, cfg.accent, 260, 0.6, true);
          }
        }
      }
    }

    // Plasma Blaster Shoot (K / Z / Right Click)
    if(pressed('shoot') && p.shootCd <= 0){
      p.shootCd = 0.24;
      SFX.blaster();
      BULLETS.push({
        x: p.x + p.face * 20,
        y: p.y - 4,
        vx: p.face * 920,
        vy: 0,
        life: 1.1
      });
      spawn(p.x + p.face * 22, p.y - 4, p.face * 60, 0, 0.15, 6, C.cyan, 0, true);
    }

    // Phase Shield (Q)
    if(pressed('shield') && G.shieldCd <= 0){
      G.shieldT = 1.8;
      G.shieldCd = 5.0;
      SFX.boost();
    }

    // Environmental Forces
    p.vy += cfg.gravity * dt;
    if(cfg.wind){
      p.vx += cfg.wind.x * dt;
      p.vy += cfg.wind.y * dt;
    }
    p.vx *= cfg.airDrag || 0.985;
    p.vy *= cfg.airDrag || 0.985;

    // Platform collisions
    const prevY = p.y;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    for(const plat of PLATFORMS){
      if(plat.kind === 'move') plat.ox = Math.sin(G.t * 1.4 + plat.phase) * plat.amp;
    }
    p.onGround = false;
    for(const plat of PLATFORMS){
      if(plat.broke) continue;
      const px = plat.x + (plat.ox || 0);
      const withinX = p.x + p.radius > px && p.x - p.radius < px + plat.w;
      const crossedTop = prevY + p.radius <= plat.y && p.y + p.radius >= plat.y;
      if(withinX && crossedTop && p.vy >= 0){
        p.y = plat.y - p.radius;
        p.vy = 0;
        p.onGround = true;
        if(plat.kind === 'move') p.x += Math.cos(G.t * 1.4 + plat.phase) * plat.amp * 1.4 * dt;
        if(plat.kind === 'crack'){
          plat.crackT = (plat.crackT || 0) + dt;
          if(plat.crackT > 0.75){
            plat.broke = true;
            burst(p.x, p.y + 18, 18, '#bdefff', 180, 0.55, true);
          }
        }
      }
    }

    // Black Hole remnant pull (Fractured Moon only)
    if(cfg.hasHole){
      const hx = cfg.holePos.x, hy = cfg.holePos.y;
      const distHole = Math.hypot(hx - p.x, hy - p.y);
      if(distHole < cfg.holePullR && distHole > 0){
        const pullFactor = Math.pow(Math.max(0, 1.0 - (distHole / cfg.holePullR)), 1.3);
        const force = Math.min(cfg.holeForce * pullFactor, 360);
        p.vx += ((hx - p.x) / distHole) * force * dt;
        p.vy += ((hy - p.y) / distHole) * force * dt;
      }
      if(distHole <= cfg.holeKillR){
        die('CONSUMED BY EVENT HORIZON SINGULARITY');
        return;
      }
    }

    // Hazards update
    for(const h of HAZARDS){
      if(h.type === 'updraft' || h.type === 'downdraft' || h.type === 'icegust'){
        if(Math.abs(p.x - h.x) < h.w/2 && Math.abs(p.y - h.y) < h.h/2){
          p.vy += (h.fy || 0) * dt;
          p.vx += (h.fx || 0) * dt;
        }
      } else if(h.type === 'lowgrav' || h.type === 'heavygrav'){
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if(d < h.r){
          p.vy += (h.type === 'lowgrav' ? -cfg.gravity * 0.72 : cfg.gravity * 0.95) * dt;
        }
      } else if(h.type === 'heat' || h.type === 'acid'){
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if(d < h.r){
          G.fuel = Math.max(0, G.fuel - h.drain * dt);
          if(h.type === 'acid') p.suit = Math.max(0, p.suit - (cfg.oxygenDrain || 1.5) * dt);
          if(G.fuel <= 0 && p.inv <= 0 && G.shieldT <= 0){
            hurt(1, 'ENVIRONMENTAL RADIATION BREACH');
          }
        }
      } else if(h.type === 'lava'){
        if(Math.abs(p.x - h.x) < h.w/2 && Math.abs(p.y - h.y) < h.h/2 && p.inv <= 0 && G.shieldT <= 0){
          hurt(1, 'MOLTEN LAVA BREACH');
        }
      } else if(h.type === 'firejet'){
        const active = Math.sin(G.t * 2.8 + h.phase) > -0.2;
        if(active && Math.abs(p.x - h.x) < 32 && p.y > h.y - 180 && p.y < h.y + 20 && p.inv <= 0 && G.shieldT <= 0){
          hurt(1, 'FIRE JET IMPACT');
        }
      } else if(h.type === 'safe'){
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if(d < h.r){
          p.suit = Math.min(100, p.suit + 24 * dt);
        }
      }
    }

    // Toxic Atmosphere Suit Oxygen Drain (Vortex Prime)
    if(cfg.oxygenDrain && !HAZARDS.some(h => h.type === 'safe' && Math.hypot(p.x - h.x, p.y - h.y) < h.r)){
      p.suit = Math.max(0, p.suit - cfg.oxygenDrain * dt);
      if(p.suit <= 0 && p.inv <= 0 && G.shieldT <= 0){
        hurt(1, 'SUIT OXYGEN DEPLETED');
      }
    }

    // Falling Hot Rocks (Cinder Moon)
    if(cfg.fallingRocks && Math.floor(G.t * 1.6) !== Math.floor((G.t - dt) * 1.6)){
      DEBRIS.push({
        x: clamp(p.x + (Math.random() - 0.5) * 800, 200, cfg.width - 200),
        y: Math.max(80, p.y - 700),
        vx: (Math.random() - 0.5) * 90,
        vy: 190 + Math.random() * 140,
        radius: 18 + Math.random() * 18,
        rot: Math.random() * 6.28,
        rotSpd: (Math.random() - 0.5) * 3,
        hp: 1,
        hot: true
      });
    }

    // Debris physics & collision
    for(let k=DEBRIS.length-1; k>=0; k--){
      const d = DEBRIS[k];
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.rot += d.rotSpd * dt;
      if(Math.hypot(p.x - d.x, p.y - d.y) < p.radius + d.radius){
        if(p.inv <= 0 && G.shieldT <= 0){
          hurt(1, d.hot ? 'FALLING HOT ROCK IMPACT' : 'DEBRIS IMPACT');
          burst(d.x, d.y, 16, d.hot ? C.ember : '#9c9282', 180, 0.4);
        }
      }
      if(d.y > cfg.groundY + 120) DEBRIS.splice(k, 1);
    }

    // Enemies movement & collision
    for(let e=ENEMIES.length-1; e>=0; e--){
      const enemy = ENEMIES[e];
      enemy.x = enemy.baseX + Math.sin(G.t * 1.4 + enemy.phase) * 90;
      enemy.y += Math.sin(G.t * 2.1 + enemy.phase) * 0.35;
      const d = Math.hypot(p.x - enemy.x, p.y - enemy.y);
      if(d < p.radius + 28){
        if(p.boostT > 0 || G.shieldT > 0){
          ENEMIES.splice(e, 1);
          G.score += 60;
          burst(enemy.x, enemy.y, 24, cfg.accent, 220, 0.55, true);
        } else if(p.inv <= 0){
          hurt(1, 'HOSTILE CONTACT: ' + enemy.type.toUpperCase());
        }
      }
    }

    // Bullets update & enemy collision
    for(let b=BULLETS.length-1; b>=0; b--){
      const blt = BULLETS[b];
      blt.life -= dt;
      blt.x += blt.vx * dt;
      blt.y += blt.vy * dt;
      if(blt.life <= 0){ BULLETS.splice(b, 1); continue; }

      for(let e=ENEMIES.length-1; e>=0; e--){
        const enemy = ENEMIES[e];
        if(Math.hypot(blt.x - enemy.x, blt.y - enemy.y) < 32){
          enemy.hp -= 1;
          BULLETS.splice(b, 1);
          SFX.hit();
          burst(enemy.x, enemy.y, 12, C.cyan, 170, 0.35, true);
          if(enemy.hp <= 0){
            ENEMIES.splice(e, 1);
            G.score += 50;
            G.credits += 25;
            SFX.fuel();
            burst(enemy.x, enemy.y, 25, cfg.accent, 260, 0.6, true);
          }
          break;
        }
      }
    }

    // Collect Mandatory Resources
    for(let i=0; i<CELLS.length; i++){
      const c = CELLS[i];
      if(!c.got){
        const d = Math.hypot(p.x - c.x, p.y - c.y);
        if(d < 170 && d > 0){
          c.x = lerp(c.x, p.x, dt * 5.5);
          c.y = lerp(c.y, p.y, dt * 5.5);
        }
        if(d < 42){
          c.got = true;
          G.cellsGot++;
          G.oxygen = Math.min(100, (G.oxygen || 100) + 15);
          G.score += 25;
          G.credits += 20;
          SFX.resource();
          burst(c.x, c.y, 18, cfg.accent, 200, 0.6, true);
          if(G.cellsGot >= cfg.mandatoryCount){
            SFX.orb();
            G.toast = {
              a: 'ALL OBJECTIVES COMPLETE!',
              b: 'All ' + cfg.mandatoryCount + ' ' + cfg.mandatoryName + ' secured. Return to the Departure Rocket to launch.',
              t: 4.5
            };
          }
        }
      }
    }

    // Collect Bonus Energy Orbs
    for(let j=0; j<ORBS.length; j++){
      const o = ORBS[j];
      if(!o.got){
        const d = Math.hypot(p.x - o.x, p.y - o.y);
        if(d < 160 && d > 0){
          o.x = lerp(o.x, p.x, dt * 5.0);
          o.y = lerp(o.y, p.y, dt * 5.0);
        }
        if(d < 42){
          o.got = true;
          G.orbsGot++;
          G.fuel = Math.min(getMaxFuel(), G.fuel + 35);
          G.oxygen = Math.min(100, (G.oxygen || 100) + 25);
          G.score += 40;
          G.credits += 15;
          SFX.orb();
          burst(o.x, o.y, 20, C.gold, 220, 0.7, true);
        }
      }
    }

    // Check Boarding Departure Rocket at far end
    const rk = cfg.departureRocket;
    const distRocket = Math.hypot(p.x - (rk.x + rk.w*0.5), p.y - (rk.y + rk.h*0.5));
    const allCollected = G.cellsGot >= cfg.mandatoryCount;

    if(distRocket < 90){
      if(allCollected && (pressed('use') || pressed('thrust') || distRocket < 55)){
        G.phase = 'boarding';
        G.phaseTimer = 0;
        SFX.door();
        G.toast = {
          a: 'BOARDING DEPARTURE ROCKET',
          b: 'Systems pressurized. Engaging orbital ignition...',
          t: 3.5
        };
      } else if(!allCollected && (pressed('use') || distRocket < 65)){
        if(!G.toast || G.toast.t <= 0.5){
          SFX.warn();
          const remaining = cfg.mandatoryCount - G.cellsGot;
          G.toast = {
            a: 'SYSTEMS LOCKED',
            b: 'Retrieve ' + remaining + ' more ' + cfg.mandatoryName + ' before launch.',
            t: 2.8
          };
        }
      }
    }
  }

  // 5. PHASE: BOARDING DEPARTURE ROCKET
  else if(G.phase === 'boarding'){
    G.phaseTimer += dt;
    const rk = cfg.departureRocket;
    p.vx *= 0.8; p.vy *= 0.8;
    p.x = lerp(p.x, rk.x + rk.w*0.5, dt * 6);
    p.y = lerp(p.y, rk.y + rk.h*0.5, dt * 6);
    if(G.phaseTimer >= 1.0){
      G.phase = 'takeoff';
      G.phaseTimer = 0;
      SFX.takeoff();
    }
  }

  // 6. PHASE: TAKEOFF VERTICAL LAUNCH
  else if(G.phase === 'takeoff'){
    G.phaseTimer += dt;
    G.shake = 14;
    const rk = cfg.departureRocket;
    // Launch rocket upwards
    rk.y -= 380 * dt * (1 + G.phaseTimer * 2.5);
    p.x = rk.x + rk.w * 0.5;
    p.y = rk.y + rk.h * 0.5;

    // Heavy main engine exhaust plumes
    for(let i=0; i<5; i++){
      spawn(rk.x + rk.w*0.5 + (Math.random()-0.5)*20, rk.y + rk.h, (Math.random()-0.5)*80, 280 + Math.random()*120, 0.45, 6.5, Math.random()<0.5?'#ff9a2e':'#ffffff', 0, true);
    }

    if(G.phaseTimer >= 2.2){
      G.phase = 'warp';
      G.phaseTimer = 0;
      SFX.warp();
    }
  }

  // 7. PHASE: COSMIC WARP TO NEXT PLANET
  else if(G.phase === 'warp'){
    G.phaseTimer += dt;
    G.shake = 8;
    const nextIdx = G.worldIdx + 1;
    if(G.phaseTimer >= 1.8){
      if(nextIdx < PLANETS.length){
        // Automatically progress to next planet
        initPlanet(nextIdx);
      } else {
        // Complete the Odyssey
        G.scene = 'victory';
        SFX.orb();
      }
    }
  }

  // Boundaries clamping
  p.x = clamp(p.x, 30, cfg.width - 30);
  p.y = clamp(p.y, 30, cfg.height - 30);

  // Smooth camera tracking
  const targetCamX = clamp(p.x - W/2, 0, cfg.width - W);
  const targetCamY = clamp(p.y - H/2, 0, cfg.height - H);
  G.camX = lerp(G.camX, targetCamX, dt * 5.0);
  G.camY = lerp(G.camY, targetCamY, dt * 5.0);

  updFx(dt);
}

function hurt(amount, reason){
  if(PL.inv > 0 || G.shieldT > 0) return;
  PL.inv = 1.2;
  G.shake = 10;

  if(G.fuel > 20){
    G.fuel -= 20;
    SFX.hit();
    G.toast = { a: 'EMERGENCY SHIELD VENT', b: '-20% Fuel absorbed catastrophic breach', t: 2.2 };
  } else {
    G.hp -= amount;
    if(G.hp <= 0){
      die(reason || 'SUIT INTEGRITY COLLAPSE');
    } else {
      SFX.hit();
    }
  }
}

function die(why){
  setThrusterRumble(false);
  G.deadWhy = why;
  G.scene = 'dead';
  G.shake = 18;
  SFX.boom();
}

/* ──────── Main Render Dispatcher ──────── */
function render(){
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  UI_BUTTONS = [];

  switch(G.scene){
    case 'title':
      renderTitle();
      break;
    case 'upgrades':
      renderUpgradesMenu();
      break;
    case 'manual':
      renderManual();
      break;
    case 'play':
      renderWorldPlay();
      drawHUD();
      break;
    case 'pause':
      renderWorldPlay();
      renderPause();
      break;
    case 'victory':
      renderVictory();
      break;
    case 'dead':
      renderDead();
      break;
  }

  // Scanline overlay
  ctx.save();
  ctx.globalAlpha = 0.025;
  ctx.fillStyle = '#000';
  for(let y=0; y<H; y+=3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
}

function renderWorldPlay(){
  const cfg = LVL;
  const shakeX = (Math.random() - 0.5) * G.shake;
  const shakeY = (Math.random() - 0.5) * G.shake;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground(cfg, G.camX, G.camY, G.t);

  // Black Hole (Fractured Moon)
  if(cfg.hasHole){
    drawBlackHole(cfg.holePos, cfg.holeKillR, G.camX, G.camY, G.t);
  }

  // Terrain & Platforms
  drawTerrain(cfg, G.camX, G.camY);

  // Hazards
  drawHazards(HAZARDS, cfg, G.camX, G.camY, G.t);

  // Debris & Hot Rocks
  for(let i=0; i<DEBRIS.length; i++) drawDebris(DEBRIS[i], G.camX, G.camY);

  // Collectibles
  for(let j=0; j<CELLS.length; j++) if(!CELLS[j].got) drawMandatoryCollectible(CELLS[j], cfg, G.camX, G.camY, G.t);
  for(let k=0; k<ORBS.length; k++) if(!ORBS[k].got) drawEnergyOrb(ORBS[k], G.camX, G.camY, G.t);

  // Departure Rocket Gantry
  drawDepartureRocket(cfg, G.camX, G.camY, G.t);

  // Enemies
  drawEnemies(G.camX, G.camY, G.t);

  // Bullets
  drawBullets(G.camX, G.camY);

  // FX Particles
  drawFx(G.camX, G.camY);

  // Landing Rocket (stationary on landing pad if astronaut has exited)
  if(G.phase !== 'flight'){
    drawRocketShip({x: cfg.landingPad.x, y: cfg.landingPad.y - 12, angle: 0, thrusting: false}, G.camX, G.camY, G.t, 1.25, true);
  }

  // Player Character / Rocket
  if(G.phase === 'flight' || G.phase === 'landing'){
    drawRocketShip(PL, G.camX, G.camY, G.t, 1.25, false);
  } else if(G.phase === 'exit' || G.phase === 'explore'){
    drawAstronautCharacter(PL, G.camX, G.camY, G.t);
  }

  ctx.restore();

  // Cosmic Warp Visual Effect
  if(G.phase === 'warp'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(61,240,255,0.7)';
    ctx.lineWidth = 2.5;
    for(let i=0; i<40; i++){
      const x = (i * 27 + G.t * 600) % W;
      const y = (i * 37) % H;
      ctx.beginPath();
      ctx.moveTo(x - 90, y); ctx.lineTo(x + 90, y); ctx.stroke();
    }
    txt('HYPERDRIVE ENGAGED ➔ DESTINATION: ' + (PLANETS[G.worldIdx + 1]?.name || 'EARTH'), W/2, H/2 - 20, 20, C.cyan, 'center', F_O, 900, 3);
    txt('APPROACHING PLANETARY ORBIT', W/2, H/2 + 15, 13, C.bone, 'center', F_U, 700, 2);
    ctx.restore();
  }
}

  ctx.fillStyle = 'rgba(5,7,26,0.85)';

    { name: 'EXTENDED FUEL RESERVES', key: 'tankLv', desc: '+25% Max Thruster & Jetpack Fuel' },

    { name: 'THERMAL SHIELD RE-GEN', key: 'effLv', desc: '15% Reduced Burn & Hazard Resistance' }
  ];

  for(let i=0; i<3; i++){

    txt(it.name, W/2 - 260, y + 28, 15, C.cyan, 'left', F_U, 700);
    txt(it.desc, W/2 - 260, y + 48, 12, C.dim, 'left', F_U, 600);
    txt('LEVEL: ' + lv + ' / 3', W/2 - 260, y + 68, 12, C.gold, 'left', F_U, 700);

    const canBuy = lv < 3 && G.credits >= cost;
    const btnText = lv >= 3 ? 'MAX LEVEL' : 'UPGRADE (' + cost + ' CR)';
    uiButton(btnText, W/2 + 100, y + 24, 160, 38, () => {
      if(canBuy){
        G.credits -= cost;
        G[it.key]++;
        saveData();
        SFX.boost();
      }
    }, {
      disabled: !canBuy,
      col: canBuy ? C.green : C.dim,
      sz: 12
    });
  }

  uiButton('RETURN TO MENU', W/2 - 120, H - 42, 240, 34, () => {
    SFX.click();
    G.scene = 'title';
  });
}

/* ──────── Main Simulation Loop ──────── */
let lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (ts - lastT)/1000 || 0);
  lastT = ts;
  G.t += dt;

  if(pressed('mute')){
    muted = !muted;
    if(master) master.gain.value = muted ? 0 : 0.6;
  }
  if(pressed('pause') && G.scene === 'play'){
    G.scene = 'pause';
    setThrusterRumble(false);
    SFX.click();
  }
  if(pressed('retry') && (G.scene === 'dead' || G.scene === 'play')){
    initPlanet(G.worldIdx);
    SFX.click();
  }

  if(G.scene === 'play'){
    updatePlay(dt);
  }

  render();
  pq = {};
}

/* ──────── Pointer Events ──────── */
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return [ (e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height ];
}
cv.addEventListener('pointermove', e => {
  const q = toLogical(e);
  G.mx = q[0]; G.my = q[1];
});
cv.addEventListener('pointerdown', e => {
  audioInit();
  cv.focus();
  const q = toLogical(e);
  G.mx = q[0]; G.my = q[1];

  for(let i=UI_BUTTONS.length-1; i>=0; i--){
    const u = UI_BUTTONS[i];
    if(q[0] >= u.x && q[0] <= u.x + u.w && q[1] >= u.y && q[1] <= u.y + u.h){
      u.fn();
      return;
    }
  }
});

// Fullscreen Toggle
document.getElementById('fs-btn').addEventListener('click', () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});

// Loading screen
let loadProg = 0;
function tickLoad(){
  loadProg = Math.min(100, loadProg + 10 + (Math.random()*15|0));
  const lb = document.getElementById('lbar');
  const lt = document.getElementById('ltext');
  if(lb) lb.style.width = loadProg + '%';
  if(lt && loadProg < 100) lt.textContent = 'Calibrating thrusters & planetary telemetry... ' + loadProg + '%';
  if(loadProg >= 100){
    if(lt) lt.textContent = 'PROPULSION & NAVIGATION ONLINE';
    setTimeout(() => {
      const ld = document.getElementById('loader');
      if(ld) ld.classList.add('done');
      setTimeout(() => {
        if(ld) ld.style.display = 'none';
        cv.focus();
      }, 450);
    }, 200);
  } else {
    setTimeout(tickLoad, 40);
  }
}
tickLoad();

setTimeout(() => {
  const ld = document.getElementById('loader');
  if(ld && !ld.classList.contains('done')){
    ld.classList.add('done');
    setTimeout(() => { if(ld) ld.style.display = 'none'; cv.focus(); }, 400);
  }
}, 2500);

requestAnimationFrame(frame);

})();
