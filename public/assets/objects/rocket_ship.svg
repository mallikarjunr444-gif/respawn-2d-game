<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0bfdb"/>
      <stop offset="35%" stop-color="#e8f0fe"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a99b8"/>
    </linearGradient>
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3df0ff"/>
      <stop offset="60%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#991520"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4e69"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Main Delta Wing -->
  <path d="M 38 100 L 4 146 L 22 148 L 36 128 Z" fill="url(#finGrad)"/>
  <!-- Left Winglet -->
  <path d="M 4 146 L 2 134 L 10 138 Z" fill="#ff7a2e"/>

  <!-- Right Main Delta Wing -->
  <path d="M 82 100 L 116 146 L 98 148 L 84 128 Z" fill="url(#finGrad)"/>
  <!-- Right Winglet -->
  <path d="M 116 146 L 118 134 L 110 138 Z" fill="#ff7a2e"/>

  <!-- Main Engine Nozzles -->
  <path d="M 42 142 L 38 160 L 52 160 L 48 142 Z" fill="url(#nozzleGrad)"/>
  <path d="M 78 142 L 82 160 L 68 160 L 72 142 Z" fill="url(#nozzleGrad)"/>
  <ellipse cx="45" cy="160" rx="7" ry="2.5" fill="#ff7a2e"/>
  <ellipse cx="75" cy="160" rx="7" ry="2.5" fill="#ff7a2e"/>

  <!-- Aerodynamic Main Rocket Hull -->
  <!-- Nosecone curves from (60, 8) down to side hips at (32, 126) and (88, 126) -->
  <path d="M 60 8 Q 78 48 88 104 Q 88 132 86 144 L 34 144 Q 32 132 32 104 Q 42 48 60 8 Z" fill="url(#hullGrad)"/>

  <!-- Center Dorsal Fin -->
  <path d="M 57 88 L 60 62 L 63 88 L 60 146 Z" fill="#57606f"/>

  <!-- Racing / Fleet Stripe -->
  <path d="M 44 94 L 76 94 L 78 104 L 42 104 Z" fill="#ff4757"/>
  <path d="M 42 108 L 78 108 L 79 113 L 41 113 Z" fill="#ff7a2e"/>

  <!-- Pressurized Cockpit Canopy Glass -->
  <ellipse cx="60" cy="54" rx="11" ry="22" fill="url(#cockpitGrad)"/>
  <!-- Specular Canopy Glare -->
  <path d="M 54 40 Q 64 36 67 48 Q 63 42 56 46 Z" fill="#ffffff" opacity="0.75"/>

  <!-- RCS Thruster Ports -->
  <circle cx="36" cy="72" r="2" fill="#333333"/>
  <circle cx="84" cy="72" r="2" fill="#333333"/>

  <!-- Heat Shield Bottom Trim -->
  <path d="M 34 144 L 86 144 L 84 149 L 36 149 Z" fill="#2f3542"/>
</svg>
